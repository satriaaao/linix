name: Deploy Rentalcamera Production

on:
  push:
    branches: [main]
    paths:
      - 'bsm-cinemachine/**'
      - '.github/workflows/deploy-rentalcamera.yml'
  workflow_dispatch:

concurrency:
  group: rentalcamera-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bsm-cinemachine
    env:
      VERCEL_ORG_ID: team_hkEnz6ARwyFSBaVVZC3FJgc5
      VERCEL_PROJECT_ID: prj_2ZgaiVb3PojIszm9iYPN1YXekDjQ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Run regression tests
        run: |
          node tests/cart-navigation-20260919.test.js
          node tests/promo-asset-routing-20260919.test.js
          node signage-lib.test.cjs
          node drive-folder-lib.test.cjs
          node drive-video-lib.test.cjs
          node signage-display.test.cjs
          node signage-auth-db-lib.test.cjs
          node signage-cms-db.test.cjs

      - name: Provision free Neon database if missing
        continue-on-error: true
        run: |
          set -e
          RESOURCES="$(vercel integration list --integration neon --format=json --token="${{ secrets.VERCEL_TOKEN }}" 2>/dev/null || echo '{"resources":[]}')"
          if echo "$RESOURCES" | grep -q '"product"[[:space:]]*:[[:space:]]*"Neon"'; then
            echo "Neon database already exists; skipping provision."
          else
            vercel integration add neon               --name bsm-signage-db               --plan free_v3               --metadata region=sin1               --metadata auth=false               --environment production               --format=json               --non-interactive               --token="${{ secrets.VERCEL_TOKEN }}"
          fi


      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
