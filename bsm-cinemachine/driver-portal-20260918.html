<body>
<div class="wrap" id="app"></div>
<div class="livebar" id="livebar"><span class="pulse"></span><div><b>Live lokasi aktif</b><small id="liveText">Mengirim posisi ke customer…</small></div></div>
<script>
(function(){
const SB='https://xleceiffuopioeguniwj.supabase.co';
const KEY='sb_publishable_POksYryhG_mkFbs7N0fjKQ_4dUim7Ex';
const STORE='rentcam_driver_token_v1';
let token=localStorage.getItem(STORE)||'',data=null,vehicleData=null,opsModal=null,watchId=null,lastSent=0,knownJobs=new Set();
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return'Belum dijadwalkan';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('id-ID',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
const clean=v=>String(v||'').replace(/\D/g,'').replace(/^0/,'62');
const labels={assigned:'Driver ditugaskan',to_pickup:'Menuju lokasi',picked_up:'Barang diambil',on_the_way:'Dalam perjalanan',arrived:'Sudah tiba',completed:'Selesai',cancelled:'Dibatalkan'};
const next={assigned:['to_pickup','Berangkat ke lokasi'],to_pickup:['picked_up','Barang sudah diambil'],picked_up:['on_the_way','Mulai mengantar'],on_the_way:['arrived','Sudah tiba'],arrived:['completed','Selesaikan tugas']};
async function rpc(name,payload={}){
 const r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){d=t}
 if(!r.ok)throw new Error(d?.message||d||'Permintaan gagal');
 return d;
}
function statusClass(s){if(s==='completed')return'done';if(['to_pickup','picked_up','on_the_way','arrived'].includes(s))return'moving';return''}
function fuelText(v){const n=Number(v);if(!Number.isFinite(n))return'—';return n+'%'}
function extFor(file){const t=String(file?.type||'').toLowerCase();if(t.includes('png'))return'png';if(t.includes('webp'))return'webp';if(t.includes('gif'))return'gif';return'jpg'}
async function uploadPhoto(file,label='foto'){
 if(!file)throw new Error(label+' wajib diupload');
 const allowed=['image/jpeg','image/png','image/webp','image/gif'];
 if(file.type&&!allowed.includes(file.type))throw new Error(label+' harus JPG, PNG, WebP, atau GIF');
 if(file.size>10*1024*1024)throw new Error(label+' maksimal 10 MB');
 const uploadToken=await rpc('rentcam_driver_issue_upload_token',{p_token:token});
 if(!uploadToken)throw new Error('Gagal membuat izin upload');
 const path=uploadToken+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+extFor(file);
 const r=await fetch(SB+'/storage/v1/object/cms-media/'+path,{
   method:'POST',
   headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':file.type||'image/jpeg','x-upsert':'false'},
   body:file
 });
 if(!r.ok){let msg='Upload '+label+' gagal';try{const j=await r.json();msg=j.message||j.error||msg}catch(_){}throw new Error(msg)}
 return SB+'/storage/v1/object/public/cms-media/'+path;
}
function vehiclePanel(){
 const s=vehicleData?.active_shift;
 const fuels=Array.isArray(vehicleData?.recent_fuel)?vehicleData.recent_fuel:[];
 if(!s){
   return '<section class="keycard"><div class="keytop"><div class="keyicon">🔑</div><div class="keycopy"><small>KUNCI KENDARAAN</small><h3>Belum mengambil kendaraan</h3><p>Sebelum mulai perjalanan, pilih plat mobil dan isi checklist kondisi.</p></div><span class="keybadge">Wajib</span></div><div class="keyactions"><button class="take" data-action="open-checkout">Ambil Kunci Kendaraan</button></div></section>';
 }
 return '<section class="keycard"><div class="keytop"><div class="keyicon">🚘</div><div class="keycopy"><small>KENDARAAN SEDANG DIBAWA</small><h3>'+E(s.plate)+' · '+E(s.vehicle_name)+'</h3><p>Diambil '+E(fmt(s.checked_out_at))+'</p></div><span class="keybadge out">Kunci keluar</span></div>'+
  '<div class="keymeta"><div><small>ODOMETER AWAL</small><b>'+E(s.checkout_odometer)+' km</b></div><div><small>BBM AWAL</small><b>'+E(fuelText(s.checkout_fuel_level))+'</b></div><div><small>TIPE</small><b>'+E(s.vehicle_type||'-')+'</b></div></div>'+
  '<div class="keyactions"><button class="fuel" data-action="open-fuel">+ Isi BBM</button><button class="return" data-action="open-return">Pulangkan Kunci</button></div>'+
  (fuels.length?'<div class="fuelHistory">'+fuels.slice(0,3).map(x=>'<div class="fuelRow"><span>'+E(fmt(x.filled_at))+' · '+E(x.odometer)+' km</span><b>Rp'+Number(x.amount||0).toLocaleString('id-ID')+'</b></div>').join('')+'</div>':'')+
 '</section>';
}
function availableVehicleOptions(){
 const list=Array.isArray(vehicleData?.vehicles)?vehicleData.vehicles:[];
 return list.map(v=>'<option value="'+E(v.id)+'" '+(v.available?'':'disabled')+'>'+E(v.plate)+' · '+E(v.name)+(v.available?'':' · dipakai '+E(v.holder||'driver lain'))+'</option>').join('');
}
function fuelOptions(selected=''){
 return [0,25,50,75,100].map(v=>'<option value="'+v+'" '+(String(selected)===String(v)?'selected':'')+'>'+v+'%'+(v===0?' · Kosong':v===25?' · ¼':v===50?' · ½':v===75?' · ¾':v===100?' · Penuh':'')+'</option>').join('');
}
function opsModalHtml(){
 if(!opsModal)return'';
 if(opsModal==='checkout'){
   return '<div class="opsModal"><form class="opsDialog" data-ops-form="checkout"><div class="opsHead"><div><small>CHECKOUT KENDARAAN</small><h3>Ambil Kunci Mobil</h3></div><button type="button" data-action="close-ops">×</button></div><div class="opsBody">'+
    '<label>Plat / Kendaraan<select name="vehicle_id" required><option value="">Pilih kendaraan tersedia…</option>'+availableVehicleOptions()+'</select></label>'+
    '<div class="opsGrid"><label>Odometer awal (km)<input name="odometer" type="number" step="0.1" min="0" required inputmode="decimal"></label><label>BBM tersisa<select name="fuel_level" required><option value="">Pilih…</option>'+fuelOptions()+'</select></label></div>'+
    '<div class="photoField"><label>Foto kondisi mobil<input name="condition_photo" type="file" accept="image/*" capture="environment" required></label><small>Foto mobil sebelum dipakai. Pastikan kondisi body terlihat jelas.</small></div>'+
    '<div class="photoField"><label>Foto spidometer + indikator BBM<input name="odometer_photo" type="file" accept="image/*" capture="environment" required></label><small>Angka kilometer dan indikator BBM harus terlihat.</small></div>'+
    '<label>Catatan kondisi<textarea name="notes" placeholder="Contoh: baret pintu kiri, ban normal, kabin bersih"></textarea></label>'+
    '<div class="opsHint">Setelah checklist tersimpan, kunci tercatat atas nama Anda dan tombol perjalanan akan aktif.</div>'+
    '<div class="opsActions"><button type="button" class="cancel" data-action="close-ops">Batal</button><button type="submit" class="save">Ambil Kunci</button></div><div class="opsProgress"></div>'+
   '</div></form></div>';
 }
 if(opsModal==='fuel'){
   const s=vehicleData?.active_shift||{};
   return '<div class="opsModal"><form class="opsDialog" data-ops-form="fuel"><div class="opsHead"><div><small>LOG BBM</small><h3>Isi BBM · '+E(s.plate||'')+'</h3></div><button type="button" data-action="close-ops">×</button></div><div class="opsBody">'+
    '<div class="opsGrid"><label>Odometer saat isi<input name="odometer" type="number" step="0.1" min="'+E(s.checkout_odometer||0)+'" required></label><label>Nominal (Rp)<input name="amount" type="number" min="1" step="1000" required></label></div>'+
    '<div class="opsGrid"><label>Liter (opsional)<input name="liters" type="number" step="0.01" min="0"></label><label>BBM setelah isi<select name="fuel_level_after" required><option value="">Pilih…</option>'+fuelOptions()+'</select></label></div>'+
    '<div class="photoField"><label>Foto struk BBM<input name="receipt_photo" type="file" accept="image/*" capture="environment" required></label><small>Struk harus terbaca jelas.</small></div>'+
    '<div class="photoField"><label>Foto spidometer saat isi BBM<input name="odometer_photo" type="file" accept="image/*" capture="environment" required></label><small>Odometer dan indikator BBM harus terlihat.</small></div>'+
    '<label>Catatan<textarea name="notes" placeholder="SPBU / jenis BBM / catatan"></textarea></label>'+
    '<div class="opsActions"><button type="button" class="cancel" data-action="close-ops">Batal</button><button type="submit" class="save">Simpan BBM</button></div><div class="opsProgress"></div>'+
   '</div></form></div>';
 }
 if(opsModal==='return'){
   const s=vehicleData?.active_shift||{};
   return '<div class="opsModal"><form class="opsDialog" data-ops-form="return"><div class="opsHead"><div><small>CHECK-IN KENDARAAN</small><h3>Pulangkan Kunci · '+E(s.plate||'')+'</h3></div><button type="button" data-action="close-ops">×</button></div><div class="opsBody">'+
    '<div class="opsGrid"><label>Odometer pulang (km)<input name="odometer" type="number" step="0.1" min="'+E(s.checkout_odometer||0)+'" required></label><label>BBM tersisa<select name="fuel_level" required><option value="">Pilih…</option>'+fuelOptions()+'</select></label></div>'+
    '<div class="photoField"><label>Foto kondisi mobil saat pulang<input name="condition_photo" type="file" accept="image/*" capture="environment" required></label><small>Foto kondisi akhir kendaraan sebelum kunci diserahkan.</small></div>'+
    '<div class="photoField"><label>Foto spidometer + BBM akhir<input name="odometer_photo" type="file" accept="image/*" capture="environment" required></label><small>Odometer dan indikator BBM harus terlihat jelas.</small></div>'+
    '<label>Catatan kondisi akhir<textarea name="notes" placeholder="Kerusakan / kebersihan / kondisi akhir"></textarea></label>'+
    '<div class="opsHint">Setelah disimpan, kunci dianggap sudah kembali dan kendaraan tersedia untuk driver lain.</div>'+
    '<div class="opsActions"><button type="button" class="cancel" data-action="close-ops">Batal</button><button type="submit" class="save">Pulangkan Kunci</button></div><div class="opsProgress"></div>'+
   '</div></form></div>';
 }
 return'';
}

function jobCard(j){
 const d=j.delivery||{},deliver=j.kind==='deliver',address=deliver?(d.address||'Lokasi customer'):(d.return_address||'Rentcam');
 const origin=deliver?(d.origin||'Rentcam'):(d.address||'Lokasi customer');
 const n=next[j.status];
 const phone=clean(j.customer_phone);
 const lat=Number(d.latitude),lng=Number(d.longitude);
 const dest=(Number.isFinite(lat)&&Number.isFinite(lng))?lat+','+lng:address;
 return '<article class="job" data-job="'+E(j.id)+'">'+
  '<div class="jobHead"><div><span class="kind '+(deliver?'':'collect')+'">'+(deliver?'ANTAR':'JEMPUT')+'</span><h3>'+E(j.order_number)+'</h3><div class="customer">'+E(j.customer_name)+' · '+E(j.customer_phone||'-')+'</div></div><span class="status '+statusClass(j.status)+'"><i></i>'+E(labels[j.status]||j.status)+'</span></div>'+
  '<div class="vehicle"><div class="vehicleIcon">🚘</div><div><b>'+E(j.vehicle?.plate||'Belum ada plat')+'</b><small>'+E(j.vehicle?.name||'Kendaraan belum dipilih')+'</small></div></div>'+
  '<div class="route"><div class="routeLine"><span class="dot"></span><span class="rail"></span><span class="dot end"></span></div><div class="routeText"><div><small>DARI</small><b>'+E(origin)+'</b></div><div><small>TUJUAN</small><b>'+E(address)+'</b></div></div></div>'+
  '<div class="meta"><span>🕐 '+E(fmt(j.scheduled_at))+'</span><span>📦 '+E(j.kind==='deliver'?'Pengantaran':'Penjemputan')+'</span></div>'+
  (j.notes?'<div class="note">'+E(j.notes)+'</div>':'')+
  '<div class="actions">'+
   '<a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'" target="_blank" rel="noopener">Navigasi</a>'+
   (phone?'<a class="wa" href="https://wa.me/'+E(phone)+'" target="_blank" rel="noopener">WhatsApp Customer</a>':'<span></span>')+
   (n?'<button class="primary" data-action="next" data-id="'+E(j.id)+'" data-status="'+E(n[0])+'">'+E(n[1])+'</button>':'')+
  '</div>'+
 '</article>';
}
function render(){
 if(!data?.ok){renderLogin(data?.message||'Sesi berakhir');return}
 const jobs=Array.isArray(data.jobs)?data.jobs:[];
 const open=jobs.filter(x=>x.status!=='completed');
 const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
 const todayCount=open.filter(x=>String(x.scheduled_at||'').slice(0,10)===today).length;
 document.getElementById('app').innerHTML=
  '<div class="top"><div class="topin"><div class="logo">R</div><div class="toptext"><b>'+E(data.driver?.name||'Driver')+'</b><small>@'+E(data.driver?.username||'')+'</small></div><button data-action="logout">Keluar</button></div></div>'+
  '<section class="hero"><small>PORTAL DRIVER RENTCAM</small><h1>Halo, '+E((data.driver?.name||'Driver').split(' ')[0])+'</h1><p>Tugas yang dijadwalkan admin akan muncul otomatis di sini. Update status dan lokasi supaya customer bisa mengikuti perjalanan.</p><div class="heroActions"><button data-action="live" class="live '+(watchId!==null?'on':'')+'">'+(watchId!==null?'Matikan Live Lokasi':'Aktifkan Live Lokasi')+'</button><button data-action="notify">Aktifkan Notifikasi</button><button data-action="refresh">Perbarui</button></div></section>'+
  vehiclePanel()+
  '<div class="summary"><div><small>TUGAS AKTIF</small><b>'+open.length+'</b></div><div><small>HARI INI</small><b>'+todayCount+'</b></div><div><small>SELESAI</small><b>'+jobs.filter(x=>x.status==='completed').length+'</b></div></div>'+
  '<div class="sectionTitle"><h2>Jadwal Saya</h2><span>'+jobs.length+' tugas</span></div>'+
  '<section class="jobs">'+(jobs.map(jobCard).join('')||'<div class="empty"><b>Belum ada tugas.</b><br><small>Jadwal dari CMS akan muncul otomatis.</small></div>')+'</section>'+
  opsModalHtml();
}
async function load(silent=false){
 if(!token){renderLogin();return}
 try{
  const [d,vdata]=await Promise.all([
    rpc('rentcam_driver_jobs',{p_token:token}),
    rpc('rentcam_driver_vehicle_dashboard',{p_token:token})
  ]);
  if(!d?.ok||!vdata?.ok){localStorage.removeItem(STORE);token='';renderLogin(d?.message||vdata?.message||'Silakan login kembali');return}
  vehicleData=vdata;
  const newJobs=(d.jobs||[]).filter(j=>!knownJobs.has(j.id));
  if(knownJobs.size&&newJobs.length&&'Notification'in window&&Notification.permission==='granted'){
    new Notification('Tugas baru Rentcam',{body:newJobs[0].order_number+' · '+newJobs[0].customer_name});
  }
  data=d;
  knownJobs=new Set((d.jobs||[]).map(j=>j.id));
  render();
 }catch(e){if(!silent)document.getElementById('app').innerHTML='<div class="error">'+E(e.message)+'</div>'}
}
function getPos(){
 return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:10000}));
}
async function sendLocation(pos){
 if(!data?.jobs)return;
 const active=data.jobs.filter(j=>j.status!=='completed'&&j.status!=='cancelled');
 if(!active.length)return;
 const payload={p_token:token,p_lat:pos.coords.latitude,p_lng:pos.coords.longitude,p_accuracy:Math.round(pos.coords.accuracy||0)};
 await Promise.allSettled(active.map(j=>rpc('rentcam_driver_update_location',{...payload,p_assignment:j.id})));
 document.getElementById('liveText').textContent='Posisi terakhir '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function startLive(){
 if(!navigator.geolocation){alert('Browser tidak mendukung lokasi');return}
 if(watchId!==null)return;
 watchId=navigator.geolocation.watchPosition(async pos=>{
  const now=Date.now();if(now-lastSent<12000)return;lastSent=now;
  try{await sendLocation(pos)}catch(_){}
 },err=>{alert('Lokasi gagal: '+err.message);stopLive()},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
 document.getElementById('livebar').classList.add('on');render();
}
function stopLive(){
 if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
 watchId=null;document.getElementById('livebar').classList.remove('on');render();
}
async function updateStatus(id,status,button){
 button.disabled=true;
 try{
  let pos=null;try{pos=await getPos()}catch(_){}
  const d=await rpc('rentcam_driver_update_job',{
   p_token:token,p_assignment:id,p_status:status,
   p_lat:pos?.coords?.latitude??null,p_lng:pos?.coords?.longitude??null,
   p_accuracy:pos?Math.round(pos.coords.accuracy||0):null
  });
  if(!d?.ok)throw new Error(d?.message||'Gagal update status');
  await load(true);
 }catch(e){alert(e.message)}finally{button.disabled=false}
}
async function saveOps(form){
 const kind=form.dataset.opsForm;
 const fd=new FormData(form);
 const progress=form.querySelector('.opsProgress');
 const btn=form.querySelector('[type="submit"]');if(btn)btn.disabled=true;
 try{
   if(progress)progress.textContent='Mengupload foto…';
   if(kind==='checkout'){
     const [condition,odo]=await Promise.all([
       uploadPhoto(fd.get('condition_photo'),'Foto kondisi mobil'),
       uploadPhoto(fd.get('odometer_photo'),'Foto spidometer')
     ]);
     if(progress)progress.textContent='Menyimpan checkout kendaraan…';
     const d=await rpc('rentcam_driver_vehicle_checkout',{
       p_token:token,p_vehicle:fd.get('vehicle_id'),
       p_odometer:Number(fd.get('odometer')),p_fuel_level:Number(fd.get('fuel_level')),
       p_condition_photo:condition,p_odometer_photo:odo,p_notes:String(fd.get('notes')||'').trim()
     });
     if(!d?.ok)throw new Error(d?.message||'Checkout kendaraan gagal');
   }else if(kind==='fuel'){
     const [receipt,odo]=await Promise.all([
       uploadPhoto(fd.get('receipt_photo'),'Foto struk BBM'),
       uploadPhoto(fd.get('odometer_photo'),'Foto spidometer')
     ]);
     if(progress)progress.textContent='Menyimpan log BBM…';
     const d=await rpc('rentcam_driver_fuel_add',{
       p_token:token,p_odometer:Number(fd.get('odometer')),p_amount:Number(fd.get('amount')),
       p_liters:Number(fd.get('liters')||0),p_fuel_level_after:Number(fd.get('fuel_level_after')),
       p_receipt_photo:receipt,p_odometer_photo:odo,p_notes:String(fd.get('notes')||'').trim()
     });
     if(!d?.ok)throw new Error(d?.message||'Log BBM gagal');
   }else if(kind==='return'){
     const [condition,odo]=await Promise.all([
       uploadPhoto(fd.get('condition_photo'),'Foto kondisi mobil'),
       uploadPhoto(fd.get('odometer_photo'),'Foto spidometer')
     ]);
     if(progress)progress.textContent='Mengembalikan kunci…';
     const d=await rpc('rentcam_driver_vehicle_return',{
       p_token:token,p_odometer:Number(fd.get('odometer')),p_fuel_level:Number(fd.get('fuel_level')),
       p_condition_photo:condition,p_odometer_photo:odo,p_notes:String(fd.get('notes')||'').trim()
     });
     if(!d?.ok)throw new Error(d?.message||'Pengembalian kendaraan gagal');
   }
   opsModal=null;await load(true);
 }catch(err){if(progress)progress.textContent='';alert(err.message)}finally{if(btn)btn.disabled=false}
}
document.addEventListener('submit',async e=>{
 if(e.target.matches('[data-ops-form]')){e.preventDefault();await saveOps(e.target);return}
 if(e.target.id!=='loginForm')return;
 e.preventDefault();
 const fd=new FormData(e.target),btn=e.target.querySelector('button');btn.disabled=true;
 try{
  const d=await rpc('rentcam_driver_login',{p_username:String(fd.get('username')||''),p_password:String(fd.get('password')||'')});
  if(!d?.ok){renderLogin(d?.message||'Login gagal');return}
  token=d.token;localStorage.setItem(STORE,token);knownJobs.clear();await load();
 }catch(err){renderLogin(err.message)}finally{btn.disabled=false}
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='refresh'){await load();return}
 if(a==='open-checkout'){opsModal='checkout';render();return}
 if(a==='open-fuel'){if(!vehicleData?.active_shift){alert('Ambil kunci kendaraan dulu.');return}opsModal='fuel';render();return}
 if(a==='open-return'){if(!vehicleData?.active_shift){alert('Tidak ada kendaraan yang sedang dibawa.');return}opsModal='return';render();return}
 if(a==='close-ops'){opsModal=null;render();return}
 if(a==='logout'){
  try{
   const out=await rpc('rentcam_driver_logout',{p_token:token});
   if(!out?.ok){alert(out?.message||'Kunci kendaraan harus dipulangkan sebelum logout');return}
  }catch(err){alert(err.message);return}
  stopLive();localStorage.removeItem(STORE);token='';data=null;vehicleData=null;renderLogin();return
 }
 if(a==='live'){watchId===null?startLive():stopLive();return}
 if(a==='notify'){
  if(!('Notification'in window)){alert('Browser ini belum mendukung notifikasi web.');return}
  const p=await Notification.requestPermission();alert(p==='granted'?'Notifikasi aktif.':'Notifikasi belum diizinkan.');return;
 }
 if(a==='next'){await updateStatus(b.dataset.id,b.dataset.status,b)}
});
load();
setInterval(()=>{if(token&&!document.hidden)load(true)},12000);
})();</script>
</body>
</html>
