async function rpc(name,payload={}){

function opsEditing(){return !!document.querySelector('[data-ops-form]')}
function readOpsDraft(){
 try{return JSON.parse(sessionStorage.getItem(OPS_DRAFT)||'null')}catch(_){return null}
}
function saveOpsDraft(form){
 if(!form)return;
 const values={};
 for(const el of form.elements){
   if(!el.name||el.type==='file'||el.type==='submit'||el.type==='button')continue;
   values[el.name]=el.type==='checkbox'?!!el.checked:el.value;
 }
 sessionStorage.setItem(OPS_DRAFT,JSON.stringify({kind:form.dataset.opsForm||'',values,updated_at:Date.now()}));
}
function restoreOpsDraft(form){
 if(!form)return;
 const draft=readOpsDraft();
 if(!draft||draft.kind!==form.dataset.opsForm)return;
 for(const [name,value] of Object.entries(draft.values||{})){
   const el=form.elements.namedItem(name);
   if(!el)continue;
   if(el.type==='checkbox')el.checked=!!value;
   else if(value!==undefined&&value!==null)el.value=String(value);
 }
}
function clearOpsDraft(){sessionStorage.removeItem(OPS_DRAFT)}

 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){reject(new Error('GPS tidak didukung browser ini'));return}
  navigator.geolocation.getCurrentPosition(resolve,err=>{
    const map={1:'Izin lokasi ditolak. Aktifkan Location untuk portal driver.',2:'Lokasi tidak tersedia.',3:'Pengambilan lokasi terlalu lama.'};

async function reverseAddress(lat,lng){
 const now=Date.now();
 if(addressCache&&now-addressCache.at<120000){
   const dy=(addressCache.lat-lat)*111000;
   const dx=(addressCache.lng-lng)*111000*Math.cos(lat*Math.PI/180);
   if(Math.hypot(dx,dy)<120)return addressCache.address;
 }
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),3500);
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=id&zoom=18&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lng),{
    headers:{Accept:'application/json'},
    signal:controller.signal
  });
  if(!r.ok)throw new Error('reverse geocode '+r.status);
  const j=await r.json();
  const address=String(j.display_name||'').trim()||('GPS '+lat.toFixed(6)+', '+lng.toFixed(6));
  addressCache={lat,lng,address,at:Date.now()};
  return address;
 }catch(_){
  return 'GPS '+lat.toFixed(6)+', '+lng.toFixed(6);
 }finally{
  clearTimeout(timer);
 }
}
function loadPhoto(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Foto tidak dapat dibaca'))};
  img.src=url;
 });
}
function wrapCanvasText(ctx,text,maxWidth){
 const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let line='';
 for(const word of words){
  const test=line?line+' '+word:word;
  if(line&&ctx.measureText(test).width>maxWidth){lines.push(line);line=word}else line=test;
 }
 if(line)lines.push(line);

}
function roundRectPath(ctx,x,y,w,h,r){
 const rr=Math.min(r,w/2,h/2);

 ctx.moveTo(x+rr,y);ctx.lineTo(x+w-rr,y);ctx.quadraticCurveTo(x+w,y,x+w,y+rr);

 ctx.lineTo(x+rr,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
 ctx.lineTo(x,y+rr);ctx.quadraticCurveTo(x,y,x+rr,y);ctx.closePath();
}
async function watermarkPhoto(file,meta){
 if(!file||!file.size)throw new Error((meta.photoType||'Foto')+' wajib diupload');
 if(file.size>15*1024*1024)throw new Error((meta.photoType||'Foto')+' maksimal 15 MB');

 const img=await loadPhoto(file);
 const maxSide=1280;
 const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
 const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
 const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext('2d',{alpha:false});
 ctx.drawImage(img,0,0,w,h);

 const pad=Math.max(18,Math.round(w*.022));
 const titleSize=Math.max(20,Math.round(w*.024));
 const bodySize=Math.max(15,Math.round(w*.017));
 const boxX=pad,boxW=w-pad*2,maxText=boxW-pad*2;
 const title=(meta.photoType||'FOTO OPERASIONAL')+(meta.orderNumber?' • '+meta.orderNumber:'');
 const time=formatWIB(meta.capturedAt);
 const who='Driver: '+(meta.driverName||'-')+' • Plat: '+(meta.vehiclePlate||'-');
 const address=meta.address||('GPS '+Number(meta.lat).toFixed(6)+', '+Number(meta.lng).toFixed(6));
 const gps='GPS: '+Number(meta.lat).toFixed(6)+', '+Number(meta.lng).toFixed(6)+' • Akurasi ±'+Math.round(meta.accuracy||0)+' m';

 ctx.font='700 '+titleSize+'px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';
 const titleLines=wrapCanvasText(ctx,title,maxText);
 ctx.font='500 '+bodySize+'px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';
 const addressLines=wrapCanvasText(ctx,address,maxText);
 const gpsLines=wrapCanvasText(ctx,gps,maxText);
 const titleLH=Math.round(titleSize*1.32),bodyLH=Math.round(bodySize*1.42);
 const boxH=pad*2+titleLines.length*titleLH+bodyLH*2+(addressLines.length+gpsLines.length)*bodyLH;
 const boxY=h-boxH-pad;

 ctx.save();
 ctx.fillStyle='rgba(10,18,31,.88)';
 roundRectPath(ctx,boxX,boxY,boxW,boxH,Math.max(16,Math.round(w*.016)));
 ctx.fill();
 ctx.restore();

 const accent=Math.max(10,Math.round(w*.012));
 let y=boxY+pad+titleSize;
 ctx.fillStyle='#f26a21';ctx.beginPath();ctx.arc(boxX+pad+accent/2,y-titleSize*.35,accent/2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='700 '+titleSize+'px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';
 titleLines.forEach((line,i)=>{ctx.fillText(line,boxX+pad+(i===0?accent+12:0),y);y+=titleLH});
 ctx.font='500 '+bodySize+'px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';
 ctx.fillStyle='#f8fafc';ctx.fillText(time,boxX+pad,y);y+=bodyLH;
 ctx.fillText(who,boxX+pad,y);y+=bodyLH;
 ctx.fillStyle='#e2e8f0';addressLines.forEach(line=>{ctx.fillText(line,boxX+pad,y);y+=bodyLH});
 ctx.fillStyle='#b7c3d4';gpsLines.forEach(line=>{ctx.fillText(line,boxX+pad,y);y+=bodyLH});

 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));
 if(!blob)throw new Error('Gagal membuat foto watermark');
 return blob;
}

 const path=uploadToken+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';

}

async function geocodeOfficeAddress(address){
 const q=String(address||'').trim();if(!q)return null;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),4500);
 try{
   const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=id&q='+encodeURIComponent(q),{
     headers:{Accept:'application/json'},signal:controller.signal
   });
   if(!r.ok)throw new Error('geocode');
   const j=await r.json(),x=j?.[0];
   const lat=Number(x?.lat),lng=Number(x?.lon);
   return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null;
 }catch(_){return null}finally{clearTimeout(timer)}
}
async function resolveGoogleShortUrl(url){
 const raw=String(url||'').trim();if(!raw)return null;
 const direct=parseMapsCoords(raw);if(direct)return{...direct,final_url:raw};
 try{
   const r=await fetch('/api/maps-resolve?url='+encodeURIComponent(raw),{cache:'no-store'});
   const j=await r.json();
   const lat=Number(j?.lat),lng=Number(j?.lng);
   if(j?.ok&&Number.isFinite(lat)&&Number.isFinite(lng))return{lat,lng,final_url:j.final_url||raw};
 }catch(_){}
 return null;
}
async function resolveOfficeStart(fallbackPos){
 const o=officeData||{};
 const rawLat=o.lat,rawLng=o.lng;
 if(rawLat!==null&&rawLat!==undefined&&rawLat!==''&&rawLng!==null&&rawLng!==undefined&&rawLng!==''){
   const lat=Number(rawLat),lng=Number(rawLng);
   if(Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180){
     return{lat,lng,name:o.name||'Kantor Rentcam',address:o.address||''};
   }
 }
 const fromUrl=await resolveGoogleShortUrl(o.maps_url);
 if(fromUrl)return{...fromUrl,name:o.name||'Kantor Rentcam',address:o.address||''};
 const fromAddress=await geocodeOfficeAddress(o.address);
 if(fromAddress)return{...fromAddress,name:o.name||'Kantor Rentcam',address:o.address||''};
 if(fallbackPos)return{lat:fallbackPos.coords.latitude,lng:fallbackPos.coords.longitude,name:'Posisi driver',address:'GPS realtime'};
 return null;
}
function parseMapsCoords(url){
 const s=String(url||'');
 let m=s.match(/[?&](?:q|query|destination)=(-?\d+(?:\.\d+)?)[,%2C]+(-?\d+(?:\.\d+)?)/i);
 if(!m)m=s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
 if(!m)return null;
 const lat=Number(m[1]),lng=Number(m[2]);
 return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null;
}
function jobCoords(j){
 const d=j?.delivery||{};
 const rawLat=d.latitude,rawLng=d.longitude;
 if(rawLat!==null&&rawLat!==undefined&&rawLat!==''&&rawLng!==null&&rawLng!==undefined&&rawLng!==''){
   const lat=Number(rawLat),lng=Number(rawLng);
   if(Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180)return{lat,lng};
 }
 return parseMapsCoords(d.maps_url);
}
function routeStops(jobs){
 return (jobs||[])
  .filter(j=>j.status!=='completed'&&j.status!=='cancelled')
  .map(j=>({job:j,coords:jobCoords(j)}))
  .filter(x=>x.coords)
  .sort((a,b)=>String(a.job.scheduled_at||'').localeCompare(String(b.job.scheduled_at||'')));
}
function routePlannerCard(jobs){

 return '<section class="routePlan"><div class="routePlanHead"><div><small>RUTE KERJA DRIVER</small><h2>Peta Perjalanan Hari Ini</h2><p>Posisi awal / kantor → lokasi A → B → C sesuai urutan jadwal.</p></div><a id="routeGoogle" href="#" target="_blank" rel="noopener">Navigasi Semua Stop</a></div>'+
 '<div class="routePlanStats"><div><small>TOTAL STOP</small><b>'+stops.length+'</b></div><div><small>TOTAL JARAK</small><b id="routeTotalKm">Menghitung…</b></div><div><small>ESTIMASI</small><b id="routeTotalEta">—</b></div></div>'+
 '<div id="driverRouteMap" class="routeMap"></div><div class="routeLegend"><span><i></i>Rute jalan</span><span><em></em>Posisi driver realtime</span></div><div id="routeLegs" class="routeLegs"><div class="routeLoading">Menghitung rute jalan…</div></div></section>';
}
function haversineKm(a,b){
 const R=6371,toRad=x=>x*Math.PI/180;
 const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
 const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}
function googleMultiStopUrl(start,stops){
 if(!start||!stops.length)return'#';
 const last=stops[stops.length-1].coords;
 const mids=stops.slice(0,-1).map(x=>x.coords.lat+','+x.coords.lng).join('|');
 let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(start.lat+','+start.lng)+'&destination='+encodeURIComponent(last.lat+','+last.lng);
 if(mids)u+='&waypoints='+encodeURIComponent(mids);
 return u;
}
function renderRouteLegs(start,stops,legs){
 const host=document.getElementById('routeLegs');if(!host)return;
 const rows=[];
 let prevName=officeData?.name||'Kantor Rentcam';
 stops.forEach((s,i)=>{
   const leg=legs?.[i];
   const km=leg?leg.distance/1000:haversineKm(i===0?start:stops[i-1].coords,s.coords);
   const mins=leg?Math.max(1,Math.round(leg.duration/60)):null;
   const letter=String.fromCharCode(65+i);
   const destName=(s.job.customer_name||'Lokasi '+letter)+' · '+(s.job.kind==='deliver'?'Antar':'Jemput');
   rows.push('<div class="routeLeg"><span class="routeLetter">'+letter+'</span><div><b>'+E(prevName)+' → '+E(destName)+'</b><small>'+E(s.job.delivery?.address||s.job.delivery?.maps_url||'Lokasi customer')+'</small></div><strong>'+km.toFixed(1)+' km'+(mins?' · '+mins+' mnt':'')+'</strong></div>');
   prevName=destName;
 });
 host.innerHTML=rows.join('');
}
async function initRoutePlanner(jobs,forcedPos=null){
 const el=document.getElementById('driverRouteMap');if(!el||typeof L==='undefined')return;
 const stops=routeStops(jobs);if(!stops.length)return;
 let pos=forcedPos;
 if(!pos&&lastLivePosition?.pos)pos=lastLivePosition.pos;
 if(!pos){try{pos=await getCurrentPositionStrict()}catch(_){}}
 const start=await resolveOfficeStart(pos);
 if(!start){document.getElementById('routeLegs').innerHTML='<div class="routeLoading">Lokasi kantor belum dapat ditentukan. Atur Lokasi Kantor di CMS.</div>';return}
 routePlannerLastAt=Date.now();
 if(routePlannerMap){routePlannerMap.remove();routePlannerMap=null}
 routePlannerLine=null;routePlannerLiveMarker=null;
 routePlannerMap=L.map(el,{zoomControl:true,attributionControl:true});
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(routePlannerMap);
 routePlannerMarkers=[];
 const startIcon=L.divIcon({className:'route-div-icon',html:'<div class="route-pin start">S</div>',iconSize:[34,34],iconAnchor:[17,17]});
 routePlannerMarkers.push(L.marker([start.lat,start.lng],{icon:startIcon}).addTo(routePlannerMap).bindPopup('<b>'+E(start.name||'Kantor Rentcam')+'</b><br>'+E(start.address||'Titik awal rute')));
 if(pos){
   const live={lat:pos.coords.latitude,lng:pos.coords.longitude};
   const liveIcon=L.divIcon({className:'route-div-icon',html:'<div class="route-pin live">🚗</div>',iconSize:[34,34],iconAnchor:[17,17]});
   routePlannerLiveMarker=L.marker([live.lat,live.lng],{icon:liveIcon,zIndexOffset:1000}).addTo(routePlannerMap).bindPopup('Posisi driver realtime');
 }
 stops.forEach((s,i)=>{
   const letter=String.fromCharCode(65+i);
   const icon=L.divIcon({className:'route-div-icon',html:'<div class="route-pin">'+letter+'</div>',iconSize:[34,34],iconAnchor:[17,17]});
   routePlannerMarkers.push(L.marker([s.coords.lat,s.coords.lng],{icon}).addTo(routePlannerMap).bindPopup('<b>'+letter+' · '+E(s.job.customer_name||'Customer')+'</b><br>'+E(s.job.delivery?.address||'')));
 });
 const boundPoints=[[start.lat,start.lng],...stops.map(x=>[x.coords.lat,x.coords.lng])];
 if(pos)boundPoints.push([pos.coords.latitude,pos.coords.longitude]);
 const bounds=L.latLngBounds(boundPoints);
 routePlannerMap.fitBounds(bounds,{padding:[35,35],maxZoom:15});
 const g=document.getElementById('routeGoogle');if(g)g.href=googleMultiStopUrl(start,stops);
 const coords=[start,...stops.map(x=>x.coords)];
 try{
   const path=coords.map(x=>x.lng+','+x.lat).join(';');
   const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+path+'?overview=full&geometries=geojson&steps=false');
   const j=await r.json();
   const route=j?.routes?.[0];if(!route)throw new Error('route');
   if(routePlannerLine)routePlannerMap.removeLayer(routePlannerLine);
   const latlngs=route.geometry.coordinates.map(x=>[x[1],x[0]]);
   const casing=L.polyline(latlngs,{weight:11,opacity:.96,color:'#ffffff',lineCap:'round',lineJoin:'round'});
   const main=L.polyline(latlngs,{weight:7,opacity:1,color:'#2f6fe5',lineCap:'round',lineJoin:'round'});
   routePlannerLine=L.layerGroup([casing,main]).addTo(routePlannerMap);
   routePlannerMap.fitBounds(main.getBounds(),{padding:[38,38],maxZoom:16});
   const km=route.distance/1000,mins=Math.max(1,Math.round(route.duration/60));
   const kmEl=document.getElementById('routeTotalKm'),etaEl=document.getElementById('routeTotalEta');
   if(kmEl)kmEl.textContent=km.toFixed(1)+' km';if(etaEl)etaEl.textContent=mins+' mnt';
   renderRouteLegs(start,stops,route.legs);
 }catch(_){
   const pts=coords.map(x=>[x.lat,x.lng]);
   const casing=L.polyline(pts,{weight:10,opacity:.95,color:'#fff',dashArray:'9 8'});
   const main=L.polyline(pts,{weight:6,opacity:.9,color:'#2f6fe5',dashArray:'9 8'});
   routePlannerLine=L.layerGroup([casing,main]).addTo(routePlannerMap);
   const legs=stops.map((s,i)=>({distance:haversineKm(i===0?start:stops[i-1].coords,s.coords)*1000,duration:0}));
   const total=legs.reduce((n,x)=>n+x.distance,0)/1000;
   const kmEl=document.getElementById('routeTotalKm'),etaEl=document.getElementById('routeTotalEta');
   if(kmEl)kmEl.textContent='± '+total.toFixed(1)+' km';if(etaEl)etaEl.textContent='Rute estimasi';
   renderRouteLegs(start,stops,legs);
 }
}
function renderLogin(msg=''){
 document.getElementById('livebar').classList.remove('on');
 document.getElementById('app').innerHTML='<div class="login"><form class="loginCard" id="loginForm"><div class="loginBrand"><div class="logo">R</div><div><b>Rentcam Driver</b><small>Portal Operasional</small></div></div><h1>Login Driver</h1><p>Masuk untuk melihat jadwal, kendaraan, customer, status perjalanan, dan live lokasi.</p><label>Username<input name="username" required autocomplete="username" autocapitalize="none"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="loginBtn" type="submit">Masuk</button><div class="loginError">'+E(msg)+'</div></form></div>';
}
function jobCard(j){
 const d=j.delivery||{},deliver=j.kind==='deliver',address=deliver?(d.address||'Lokasi customer'):(d.return_address||'Rentcam');
 const origin=deliver?(d.origin||'Rentcam'):(d.address||'Lokasi customer');
 const n=next[j.status];
 const phone=clean(j.customer_phone);
 const lat=Number(d.latitude),lng=Number(d.longitude);
 const dest=(Number.isFinite(lat)&&Number.isFinite(lng))?lat+','+lng:address;
 const mapHref=d.maps_url||('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest));
 return '<article class="job" data-job="'+E(j.id)+'">'+
  '<div class="jobHead"><div><span class="kind '+(deliver?'':'collect')+'">'+(deliver?'ANTAR':'JEMPUT')+'</span><h3>'+E(j.order_number)+'</h3><div class="customer">'+E(j.customer_name)+' · '+E(j.customer_phone||'-')+'</div></div><span class="status '+statusClass(j.status)+'"><i></i>'+E(labels[j.status]||j.status)+'</span></div>'+
  '<div class="vehicle"><div class="vehicleIcon">🚘</div><div><b>'+E(j.vehicle?.plate||'Belum ada plat')+'</b><small>'+E(j.vehicle?.name||'Kendaraan belum dipilih')+'</small></div></div>'+
  '<div class="route"><div class="routeLine"><span class="dot"></span><span class="rail"></span><span class="dot end"></span></div><div class="routeText"><div><small>DARI</small><b>'+E(origin)+'</b></div><div><small>TUJUAN</small><b>'+E(address)+'</b></div></div></div>'+
  '<div class="meta"><span>🕐 '+E(fmt(j.scheduled_at))+'</span><span>📦 '+E(j.kind==='deliver'?'Pengantaran':'Penjemputan')+'</span></div>'+
  (j.notes?'<div class="note">'+E(j.notes)+'</div>':'')+
  '<div class="actions">'+
   '<a href="'+E(mapHref)+'" target="_blank" rel="noopener">Navigasi</a>'+
   (phone?'<a class="wa" href="https://wa.me/'+E(phone)+'" target="_blank" rel="noopener">WhatsApp Customer</a>':'<span></span>')+
   (n?'<button class="primary" data-action="next" data-id="'+E(j.id)+'" data-status="'+E(n[0])+'">'+E(n[1])+'</button>':'')+
  '</div>'+
 '</article>';
}
function render(){
 if(!data?.ok){renderLogin(data?.message||'Sesi berakhir');return}
 const jobs=Array.isArray(data.jobs)?data.jobs:[];
 const open=jobs.filter(x=>x.status!=='completed');
 const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
 const todayCount=open.filter(x=>String(x.scheduled_at||'').slice(0,10)===today).length;
 document.getElementById('app').innerHTML=
  '<div class="top"><div class="topin"><div class="logo">R</div><div class="toptext"><b>'+E(data.driver?.name||'Driver')+'</b><small>@'+E(data.driver?.username||'')+'</small></div><button data-action="logout">Keluar</button></div></div>'+
  '<section class="hero"><small>PORTAL DRIVER RENTCAM</small><h1>Halo, '+E((data.driver?.name||'Driver').split(' ')[0])+'</h1><p>Live Lokasi aktif otomatis selama Anda login supaya customer bisa mengikuti perjalanan secara realtime.</p><div class="heroActions"><button data-action="live" class="live '+(watchId!==null?'on':'')+'">'+(watchId!==null?'● Live Lokasi Aktif':'Aktifkan Lokasi Sekarang')+'</button><button data-action="notify">Aktifkan Notifikasi</button><button data-action="refresh">Perbarui</button></div></section>'+
  vehiclePanel()+
  routePlannerCard(open)+
  '<div class="summary"><div><small>TUGAS AKTIF</small><b>'+open.length+'</b></div><div><small>HARI INI</small><b>'+todayCount+'</b></div><div><small>SELESAI</small><b>'+jobs.filter(x=>x.status==='completed').length+'</b></div></div>'+
  '<div class="sectionTitle"><h2>Jadwal Saya</h2><span>'+jobs.length+' tugas</span></div>'+
  '<section class="jobs">'+(jobs.map(jobCard).join('')||'<div class="empty"><b>Belum ada tugas.</b><br><small>Jadwal dari CMS akan muncul otomatis.</small></div>')+'</section>'+
  opsModalHtml();
 if(opsModal)requestAnimationFrame(()=>restoreOpsDraft(document.querySelector('[data-ops-form]')));
 if(!opsModal)requestAnimationFrame(()=>initRoutePlanner(open));
}
async function load(silent=false){
 if(!token){renderLogin();return}
 try{
  const [d,vdata,office]=await Promise.all([
    rpc('rentcam_driver_jobs',{p_token:token}),
    rpc('rentcam_driver_vehicle_dashboard',{p_token:token}),
    rpc('rentcam_driver_dispatch_settings',{p_token:token})
  ]);
  if(!d?.ok||!vdata?.ok||!office?.ok){localStorage.removeItem(STORE);token='';renderLogin(d?.message||vdata?.message||office?.message||'Silakan login kembali');return}
  vehicleData=vdata;
  officeData=office.office||{};
  const newJobs=(d.jobs||[]).filter(j=>!knownJobs.has(j.id));
  if(knownJobs.size&&newJobs.length&&'Notification'in window&&Notification.permission==='granted'){
    new Notification('Tugas baru Rentcam',{body:newJobs[0].order_number+' · '+newJobs[0].customer_name});
  }
  data=d;
  knownJobs=new Set((d.jobs||[]).map(j=>j.id));
  if(opsEditing()||opsModal)return;
  render();
 }catch(e){if(!silent)document.getElementById('app').innerHTML='<div class="error">'+E(e.message)+'</div>'}
}
function getPos(){
 return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:10000}));
}
async function sendLocation(pos){
 if(!data?.jobs)return;
 const active=data.jobs.filter(j=>j.status!=='completed'&&j.status!=='cancelled');
 if(!active.length)return;
 const payload={p_token:token,p_lat:pos.coords.latitude,p_lng:pos.coords.longitude,p_accuracy:Math.round(pos.coords.accuracy||0)};
 await Promise.allSettled(active.map(j=>rpc('rentcam_driver_update_location',{...payload,p_assignment:j.id})));
 document.getElementById('liveText').textContent='Posisi terakhir '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function showGpsHelp(message='Izin lokasi belum aktif.'){
 document.querySelector('.gpsHelp')?.remove();
 const el=document.createElement('div');el.className='gpsHelp';
 el.innerHTML='<div class="gpsHelpCard"><div class="gpsHelpIcon">📍</div><h3>Aktifkan Lokasi Driver</h3><p>'+E(message)+'</p><div class="gpsSteps"><b>Di iPhone/Safari:</b><br>1. Buka pengaturan situs/browser untuk rentalcamera.aiorbitlab.me<br>2. Ubah <b>Location / Lokasi</b> menjadi <b>Allow / Izinkan</b><br>3. Jika masih ditolak: Settings → Privacy & Security → Location Services → Safari Websites → While Using App<br>4. Kembali ke halaman ini lalu tekan <b>Coba GPS Lagi</b>.</div><div class="gpsButtons"><button class="secondary" data-gps-close>Tutup</button><button class="primary" data-gps-retry>Coba GPS Lagi</button></div></div>';
 document.body.appendChild(el);
 el.addEventListener('click',async e=>{
   if(e.target.closest('[data-gps-close]')){el.remove();return}
   if(e.target.closest('[data-gps-retry]')){
     const b=e.target.closest('button');b.disabled=true;
     try{
       const pos=await getCurrentPositionStrict();
       el.remove();
       localStorage.setItem(LIVE_STORE,'1');
       await sendLocation(pos);
       await startLive(false);
     }catch(err){el.querySelector('p').textContent=err.message;b.disabled=false}
   }
 });
}
async function requestWakeLock(){
 try{
  if('wakeLock' in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen');
 }catch(_){}
}
async function releaseWakeLock(){
 try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(_){}
}
function liveAlwaysWanted(){
 return !!token && localStorage.getItem(LIVE_STORE)==='1';
}
async function ensureLiveLocation(showHelp=true){
 if(!liveAlwaysWanted()||document.hidden||watchId!==null||autoLiveStarting)return;
 autoLiveStarting=true;
 try{
   await startLive(showHelp);
 }finally{
   autoLiveStarting=false;
 }
}
async function startLive(showHelp=true){
 if(!token)return false;
 localStorage.setItem(LIVE_STORE,'1');
 if(!navigator.geolocation){
   if(showHelp)showGpsHelp('Browser ini tidak mendukung GPS.');
   return false;
 }
 if(watchId!==null)return true;
 try{
   const first=await getCurrentPositionStrict();
   await sendLocation(first);
 }catch(err){
   if(showHelp)showGpsHelp(err.message);
   return false;
 }
 await requestWakeLock();
 watchId=navigator.geolocation.watchPosition(async pos=>{
  lastLivePosition={pos,at:Date.now()};
  const now=Date.now();if(now-lastSent<5000)return;lastSent=now;
  try{
    await sendLocation(pos);
    if(document.getElementById('driverRouteMap')&&Date.now()-routePlannerLastAt>15000)initRoutePlanner(data?.jobs||[],pos);
    const el=document.getElementById('liveText');
    if(el)el.textContent='Live • akurasi ±'+Math.round(pos.coords.accuracy||0)+' m • '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(_){}
 },async err=>{
   await stopLive(false);
   if(liveAlwaysWanted())showGpsHelp(err.code===1?'Akses lokasi ditolak oleh Safari. Izinkan lokasi untuk domain ini.':'Lokasi berhenti: '+err.message);
 },{enableHighAccuracy:true,maximumAge:1000,timeout:12000});
 const bar=document.getElementById('livebar');if(bar)bar.classList.add('on');
 if(!opsEditing()&&!opsModal)render();
 return true;
}
async function stopLive(clearIntent=false){
 if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
 watchId=null;
 if(clearIntent)localStorage.removeItem(LIVE_STORE);
 await releaseWakeLock();
 const bar=document.getElementById('livebar');if(bar)bar.classList.remove('on');
 if(data?.ok&&!opsEditing()&&!opsModal)render();
}
async function updateStatus(id,status,button){
 button.disabled=true;
 try{
  let pos=null;try{pos=await getPos()}catch(_){}
  const d=await rpc('rentcam_driver_update_job',{
   p_token:token,p_assignment:id,p_status:status,
   p_lat:pos?.coords?.latitude??null,p_lng:pos?.coords?.longitude??null,
   p_accuracy:pos?Math.round(pos.coords.accuracy||0):null
  });
  if(!d?.ok)throw new Error(d?.message||'Gagal update status');
  await load(true);
 }catch(e){alert(e.message)}finally{button.disabled=false}
}
async function saveOps(form){
 const kind=form.dataset.opsForm;
 const fd=new FormData(form);
 const progress=form.querySelector('.opsProgress');
 const btn=form.querySelector('[type="submit"]');if(btn)btn.disabled=true;
 try{
   const activeJob=(data?.jobs||[]).find(j=>j.status!=='completed'&&j.status!=='cancelled')||(data?.jobs||[])[0];
   const orderNumber=activeJob?.order_number||'OPERASIONAL';
   if(progress)progress.textContent='Menyiapkan lokasi & alamat…';
   const photoCtx=await getOperationalPhotoContext();
   if(kind==='checkout'){
     const selected=(vehicleData?.vehicles||[]).find(v=>String(v.id)===String(fd.get('vehicle_id')));
     const plate=selected?.plate||'-';
     if(progress)progress.textContent='Memproses & upload 2 foto sekaligus…';
     const [condition,odo]=await Promise.all([
       processOperationalPhotoWithContext(fd.get('condition_photo'),'KONDISI MOBIL AWAL',plate,orderNumber,photoCtx),
       processOperationalPhotoWithContext(fd.get('odometer_photo'),'SPIDOMETER AWAL',plate,orderNumber,photoCtx)
     ]);
     if(progress)progress.textContent='Menyimpan checkout kendaraan…';
     const d=await rpc('rentcam_driver_vehicle_checkout',{
       p_token:token,p_vehicle:fd.get('vehicle_id'),
       p_odometer:Number(fd.get('odometer')),p_fuel_level:Number(fd.get('fuel_level')),
       p_condition_photo:condition,p_odometer_photo:odo,p_notes:String(fd.get('notes')||'').trim()
     });
     if(!d?.ok)throw new Error(d?.message||'Checkout kendaraan gagal');
   }else if(kind==='fuel'){
     const plate=vehicleData?.active_shift?.plate||'-';
     if(progress)progress.textContent='Memproses & upload 2 foto BBM sekaligus…';
     const [receipt,odo]=await Promise.all([
       processOperationalPhotoWithContext(fd.get('receipt_photo'),'STRUK BBM',plate,orderNumber,photoCtx),
       processOperationalPhotoWithContext(fd.get('odometer_photo'),'SPIDOMETER SAAT ISI BBM',plate,orderNumber,photoCtx)
     ]);
     if(progress)progress.textContent='Menyimpan log BBM…';
     const d=await rpc('rentcam_driver_fuel_add',{
       p_token:token,p_odometer:Number(fd.get('odometer')),p_amount:Number(fd.get('amount')),
       p_liters:Number(fd.get('liters')||0),p_fuel_level_after:Number(fd.get('fuel_level_after')),
       p_receipt_photo:receipt,p_odometer_photo:odo,p_notes:String(fd.get('notes')||'').trim()
     });
     if(!d?.ok)throw new Error(d?.message||'Log BBM gagal');
   }else if(kind==='return'){
     const plate=vehicleData?.active_shift?.plate||'-';
     if(progress)progress.textContent='Memproses & upload 2 foto akhir sekaligus…';
     const [condition,odo]=await Promise.all([
       processOperationalPhotoWithContext(fd.get('condition_photo'),'KONDISI MOBIL AKHIR',plate,orderNumber,photoCtx),
       processOperationalPhotoWithContext(fd.get('odometer_photo'),'SPIDOMETER AKHIR',plate,orderNumber,photoCtx)
     ]);
     if(progress)progress.textContent='Mengembalikan kunci…';
     const d=await rpc('rentcam_driver_vehicle_return',{
       p_token:token,p_odometer:Number(fd.get('odometer')),p_fuel_level:Number(fd.get('fuel_level')),
       p_condition_photo:condition,p_odometer_photo:odo,p_notes:String(fd.get('notes')||'').trim()
     });
     if(!d?.ok)throw new Error(d?.message||'Pengembalian kendaraan gagal');
   }
   clearOpsDraft();
   opsModal=null;await load(true);
 }catch(err){if(progress)progress.textContent='';alert(err.message)}finally{if(btn)btn.disabled=false}
}
document.addEventListener('input',e=>{
 const form=e.target.closest?.('[data-ops-form]');
 if(form)saveOpsDraft(form);
},true);
document.addEventListener('change',e=>{
 const form=e.target.closest?.('[data-ops-form]');
 if(form&&e.target.type!=='file')saveOpsDraft(form);
},true);
document.addEventListener('submit',async e=>{
 if(e.target.matches('[data-ops-form]')){e.preventDefault();await saveOps(e.target);return}
 if(e.target.id!=='loginForm')return;
 e.preventDefault();
 const fd=new FormData(e.target),btn=e.target.querySelector('button');btn.disabled=true;
 try{
  const d=await rpc('rentcam_driver_login',{p_username:String(fd.get('username')||''),p_password:String(fd.get('password')||'')});
  if(!d?.ok){renderLogin(d?.message||'Login gagal');return}
  token=d.token;
  localStorage.setItem(STORE,token);
  localStorage.setItem(LIVE_STORE,'1');
  knownJobs.clear();
  await load();
  await ensureLiveLocation(true);
 }catch(err){renderLogin(err.message)}finally{btn.disabled=false}
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='refresh'){await load();return}
 if(a==='open-checkout'){opsModal='checkout';render();return}
 if(a==='open-fuel'){if(!vehicleData?.active_shift){alert('Ambil kunci kendaraan dulu.');return}opsModal='fuel';render();return}
 if(a==='open-return'){if(!vehicleData?.active_shift){alert('Tidak ada kendaraan yang sedang dibawa.');return}opsModal='return';render();return}
 if(a==='close-ops'){const form=document.querySelector('[data-ops-form]');if(form)saveOpsDraft(form);opsModal=null;render();return}
 if(a==='logout'){
  try{
   const out=await rpc('rentcam_driver_logout',{p_token:token});
   if(!out?.ok){alert(out?.message||'Kunci kendaraan harus dipulangkan sebelum logout');return}
  }catch(err){alert(err.message);return}
  await stopLive(true);
  localStorage.removeItem(STORE);
  localStorage.removeItem(LIVE_STORE);
  token='';data=null;vehicleData=null;renderLogin();return
 }
 if(a==='live'){localStorage.setItem(LIVE_STORE,'1');await ensureLiveLocation(true);return}
 if(a==='notify'){
  if(!('Notification'in window)){alert('Browser ini belum mendukung notifikasi web.');return}
  const p=await Notification.requestPermission();alert(p==='granted'?'Notifikasi aktif.':'Notifikasi belum diizinkan.');return;
 }
 if(a==='next'){await updateStatus(b.dataset.id,b.dataset.status,b)}
});
if(token&&localStorage.getItem(LIVE_STORE)!=='1')localStorage.setItem(LIVE_STORE,'1');
load().then(()=>ensureLiveLocation(true));
document.addEventListener('visibilitychange',async()=>{
 if(document.hidden)return;
 await requestWakeLock();
 await ensureLiveLocation(false);
});
window.addEventListener('focus',()=>ensureLiveLocation(false));
window.addEventListener('pageshow',()=>ensureLiveLocation(false));
window.addEventListener('online',()=>ensureLiveLocation(false));
setInterval(()=>{
 if(token&&!document.hidden){
   if(!opsEditing()&&!opsModal)load(true);
   ensureLiveLocation(false);
 }
},10000);
})();</script>
