<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101927">
<meta name="robots" content="noindex,nofollow">
<title>Portal Driver | Rentcam</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6fa;color:#172238;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,a{font:inherit}.wrap{width:min(760px,100%);margin:0 auto;padding:12px 12px 28px}.top{position:sticky;top:0;z-index:20;margin:-12px -12px 12px;padding:14px 16px;background:rgba(243,246,250,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(221,227,235,.85)}.topin{max-width:760px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:#f26a21;color:#fff;display:grid;place-items:center;font-weight:950}.toptext{min-width:0;flex:1}.toptext b{display:block;font-size:14px}.toptext small{display:block;margin-top:2px;color:#8491a3;font-size:9px}.top button{border:1px solid #dce2ea;background:#fff;color:#405069;border-radius:11px;height:38px;padding:0 11px;font-size:9px;font-weight:900}
.hero{border-radius:24px;padding:22px;background:linear-gradient(145deg,#101927,#1c2c44);color:#fff;box-shadow:0 18px 45px rgba(13,25,43,.16);margin-bottom:13px}.hero small{font-size:9px;letter-spacing:.13em;color:#ff9b65;font-weight:900}.hero h1{margin:6px 0;font-size:27px;letter-spacing:-.04em}.hero p{margin:0;color:#acb9cb;font-size:11px;line-height:1.55}.heroActions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.heroActions button{height:40px;border-radius:11px;padding:0 13px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-size:9px;font-weight:900}.heroActions button.live{background:#177f5c;border-color:#177f5c}.heroActions button.live.on{background:#cf5332;border-color:#cf5332}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.summary>div{background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:13px}.summary small{display:block;color:#8c97a7;font-size:8px}.summary b{display:block;margin-top:5px;font-size:20px;letter-spacing:-.03em}
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.sectionTitle h2{margin:0;font-size:17px}.sectionTitle span{font-size:9px;color:#8995a5}
.jobs{display:grid;gap:12px}.job{background:#fff;border:1px solid #e1e6ee;border-radius:21px;padding:17px;box-shadow:0 7px 24px rgba(25,39,58,.045)}.jobHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.kind{display:inline-flex;padding:5px 8px;border-radius:999px;background:#fff1e9;color:#c75b21;font-size:8px;font-weight:950;letter-spacing:.08em}.kind.collect{background:#eef3ff;color:#526dbb}.job h3{margin:7px 0 2px;font-size:16px}.customer{font-size:10px;color:#7d899a}.status{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;background:#fff7e8;color:#986916;font-size:9px;font-weight:900;white-space:nowrap}.status.moving{background:#eef4ff;color:#4265ae}.status.done{background:#eaf8f2;color:#177a5c}.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.vehicle{display:flex;align-items:center;gap:9px;margin-top:13px;padding:11px 12px;border-radius:13px;background:#f7f9fb}.vehicleIcon{width:36px;height:36px;border-radius:11px;background:#eaf0ff;display:grid;place-items:center}.vehicle div:nth-child(2){min-width:0;flex:1}.vehicle b,.vehicle small{display:block}.vehicle b{font-size:11px}.vehicle small{margin-top:2px;color:#8994a4;font-size:8px}
.route{display:grid;grid-template-columns:22px 1fr;gap:8px;margin-top:12px;padding:13px;border-radius:15px;background:#f7f9fc}.routeLine{display:grid;grid-template-rows:10px 1fr 10px;justify-items:center;min-height:76px}.dot{width:9px;height:9px;border-radius:50%;background:#f26a21}.dot.end{background:#2f6fe5}.rail{width:2px;background:repeating-linear-gradient(to bottom,#bcc5d2 0 4px,transparent 4px 8px)}.routeText{display:flex;flex-direction:column;justify-content:space-between;gap:14px}.routeText small{display:block;font-size:7px;font-weight:900;letter-spacing:.09em;color:#9aa4b2}.routeText b{display:block;margin-top:2px;font-size:10px;line-height:1.4;color:#34445a}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.meta span{padding:7px 9px;border:1px solid #e7ebf0;background:#f8fafb;border-radius:10px;font-size:8px;color:#657287}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions button,.actions a{min-height:42px;border-radius:12px;border:1px solid #dfe4eb;background:#fff;color:#354359;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}.actions .primary{grid-column:1/-1;background:linear-gradient(145deg,#ff8240,#f26a21);border-color:#f26a21;color:#fff}.actions .wa{background:#eaf8f1;color:#16805b;border-color:#d8eee4}.note{margin-top:11px;padding:10px 11px;border-radius:11px;background:#fff8f3;color:#795d4d;font-size:9px;line-height:1.45}
.empty,.loading,.error{background:#fff;border:1px dashed #d8dee8;border-radius:20px;padding:36px;text-align:center;color:#7d8999}.error{color:#ae414d}
.login{min-height:88vh;display:grid;place-items:center}.loginCard{width:min(460px,100%);background:#fff;border:1px solid #e1e6ee;border-radius:25px;padding:23px;box-shadow:0 20px 60px rgba(18,31,48,.10)}.loginBrand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.loginBrand .logo{width:48px;height:48px;border-radius:15px}.loginBrand b{display:block;font-size:17px}.loginBrand small{display:block;margin-top:3px;color:#8a96a6;font-size:9px}.loginCard h1{margin:0 0 5px;font-size:23px}.loginCard>p{margin:0 0 18px;color:#7d8999;font-size:10px;line-height:1.5}.loginCard label{display:block;margin-bottom:12px;font-size:9px;font-weight:850;color:#5e6a7c}.loginCard input{display:block;width:100%;margin-top:6px;height:48px;border:1px solid #d8dfe8;border-radius:13px;padding:0 13px;outline:none;font-size:13px}.loginCard input:focus{border-color:#f28a53;box-shadow:0 0 0 4px rgba(242,106,33,.09)}.loginBtn{width:100%;height:48px;border:0;border-radius:13px;background:linear-gradient(145deg,#ff8240,#f26a21);color:#fff;font-size:11px;font-weight:950}.loginError{min-height:18px;margin-top:10px;color:#b5444f;text-align:center;font-size:9px}
.livebar{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;max-width:736px;margin:auto;padding:11px 13px;border-radius:15px;background:#10243b;color:#fff;box-shadow:0 15px 35px rgba(13,25,43,.22);align-items:center;gap:9px}.livebar.on{display:flex}.pulse{width:9px;height:9px;border-radius:50%;background:#28d391;box-shadow:0 0 0 5px rgba(40,211,145,.14)}.livebar div{flex:1}.livebar b,.livebar small{display:block}.livebar b{font-size:10px}.livebar small{margin-top:2px;color:#9fb1c5;font-size:8px}
@media(max-width:540px){.summary{grid-template-columns:1fr 1fr 1fr}.summary>div{padding:11px 9px}.summary b{font-size:18px}.job{padding:15px}.hero{padding:19px}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="livebar" id="livebar"><span class="pulse"></span><div><b>Live lokasi aktif</b><small id="liveText">Mengirim posisi ke customer…</small></div></div>
<script>
(function(){
const SB='https://xleceiffuopioeguniwj.supabase.co';
const KEY='sb_publishable_POksYryhG_mkFbs7N0fjKQ_4dUim7Ex';
const STORE='rentcam_driver_token_v1';
let token=localStorage.getItem(STORE)||'',data=null,watchId=null,lastSent=0,knownJobs=new Set();
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return'Belum dijadwalkan';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('id-ID',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
const clean=v=>String(v||'').replace(/\D/g,'').replace(/^0/,'62');
const labels={assigned:'Driver ditugaskan',to_pickup:'Menuju lokasi',picked_up:'Barang diambil',on_the_way:'Dalam perjalanan',arrived:'Sudah tiba',completed:'Selesai',cancelled:'Dibatalkan'};
const next={assigned:['to_pickup','Berangkat ke lokasi'],to_pickup:['picked_up','Barang sudah diambil'],picked_up:['on_the_way','Mulai mengantar'],on_the_way:['arrived','Sudah tiba'],arrived:['completed','Selesaikan tugas']};
async function rpc(name,payload={}){
 const r=await fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){d=t}
 if(!r.ok)throw new Error(d?.message||d||'Permintaan gagal');
 return d;
}
function statusClass(s){if(s==='completed')return'done';if(['to_pickup','picked_up','on_the_way','arrived'].includes(s))return'moving';return''}
function renderLogin(msg=''){
 document.getElementById('livebar').classList.remove('on');
 document.getElementById('app').innerHTML='<div class="login"><form class="loginCard" id="loginForm"><div class="loginBrand"><div class="logo">R</div><div><b>Rentcam Driver</b><small>Portal Operasional</small></div></div><h1>Login Driver</h1><p>Masuk untuk melihat jadwal, kendaraan, customer, status perjalanan, dan live lokasi.</p><label>Username<input name="username" required autocomplete="username" autocapitalize="none"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="loginBtn" type="submit">Masuk</button><div class="loginError">'+E(msg)+'</div></form></div>';
}
function jobCard(j){
 const d=j.delivery||{},deliver=j.kind==='deliver',address=deliver?(d.address||'Lokasi customer'):(d.return_address||'Rentcam');
 const origin=deliver?(d.origin||'Rentcam'):(d.address||'Lokasi customer');
 const n=next[j.status];
 const phone=clean(j.customer_phone);
 const lat=Number(d.latitude),lng=Number(d.longitude);
 const dest=(Number.isFinite(lat)&&Number.isFinite(lng))?lat+','+lng:address;
 return '<article class="job" data-job="'+E(j.id)+'">'+
  '<div class="jobHead"><div><span class="kind '+(deliver?'':'collect')+'">'+(deliver?'ANTAR':'JEMPUT')+'</span><h3>'+E(j.order_number)+'</h3><div class="customer">'+E(j.customer_name)+' · '+E(j.customer_phone||'-')+'</div></div><span class="status '+statusClass(j.status)+'"><i></i>'+E(labels[j.status]||j.status)+'</span></div>'+
  '<div class="vehicle"><div class="vehicleIcon">🚘</div><div><b>'+E(j.vehicle?.plate||'Belum ada plat')+'</b><small>'+E(j.vehicle?.name||'Kendaraan belum dipilih')+'</small></div></div>'+
  '<div class="route"><div class="routeLine"><span class="dot"></span><span class="rail"></span><span class="dot end"></span></div><div class="routeText"><div><small>DARI</small><b>'+E(origin)+'</b></div><div><small>TUJUAN</small><b>'+E(address)+'</b></div></div></div>'+
  '<div class="meta"><span>🕐 '+E(fmt(j.scheduled_at))+'</span><span>📦 '+E(j.kind==='deliver'?'Pengantaran':'Penjemputan')+'</span></div>'+
  (j.notes?'<div class="note">'+E(j.notes)+'</div>':'')+
  '<div class="actions">'+
   '<a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'" target="_blank" rel="noopener">Navigasi</a>'+
   (phone?'<a class="wa" href="https://wa.me/'+E(phone)+'" target="_blank" rel="noopener">WhatsApp Customer</a>':'<span></span>')+
   (n?'<button class="primary" data-action="next" data-id="'+E(j.id)+'" data-status="'+E(n[0])+'">'+E(n[1])+'</button>':'')+
  '</div>'+
 '</article>';
}
function render(){
 if(!data?.ok){renderLogin(data?.message||'Sesi berakhir');return}
 const jobs=Array.isArray(data.jobs)?data.jobs:[];
 const open=jobs.filter(x=>x.status!=='completed');
 const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
 const todayCount=open.filter(x=>String(x.scheduled_at||'').slice(0,10)===today).length;
 document.getElementById('app').innerHTML=
  '<div class="top"><div class="topin"><div class="logo">R</div><div class="toptext"><b>'+E(data.driver?.name||'Driver')+'</b><small>@'+E(data.driver?.username||'')+'</small></div><button data-action="logout">Keluar</button></div></div>'+
  '<section class="hero"><small>PORTAL DRIVER RENTCAM</small><h1>Halo, '+E((data.driver?.name||'Driver').split(' ')[0])+'</h1><p>Tugas yang dijadwalkan admin akan muncul otomatis di sini. Update status dan lokasi supaya customer bisa mengikuti perjalanan.</p><div class="heroActions"><button data-action="live" class="live '+(watchId!==null?'on':'')+'">'+(watchId!==null?'Matikan Live Lokasi':'Aktifkan Live Lokasi')+'</button><button data-action="notify">Aktifkan Notifikasi</button><button data-action="refresh">Perbarui</button></div></section>'+
  '<div class="summary"><div><small>TUGAS AKTIF</small><b>'+open.length+'</b></div><div><small>HARI INI</small><b>'+todayCount+'</b></div><div><small>SELESAI</small><b>'+jobs.filter(x=>x.status==='completed').length+'</b></div></div>'+
  '<div class="sectionTitle"><h2>Jadwal Saya</h2><span>'+jobs.length+' tugas</span></div>'+
  '<section class="jobs">'+(jobs.map(jobCard).join('')||'<div class="empty"><b>Belum ada tugas.</b><br><small>Jadwal dari CMS akan muncul otomatis.</small></div>')+'</section>';
}
async function load(silent=false){
 if(!token){renderLogin();return}
 try{
  const d=await rpc('rentcam_driver_jobs',{p_token:token});
  if(!d?.ok){localStorage.removeItem(STORE);token='';renderLogin(d?.message||'Silakan login kembali');return}
  const newJobs=(d.jobs||[]).filter(j=>!knownJobs.has(j.id));
  if(knownJobs.size&&newJobs.length&&'Notification'in window&&Notification.permission==='granted'){
    new Notification('Tugas baru Rentcam',{body:newJobs[0].order_number+' · '+newJobs[0].customer_name});
  }
  data=d;
  knownJobs=new Set((d.jobs||[]).map(j=>j.id));
  render();
 }catch(e){if(!silent)document.getElementById('app').innerHTML='<div class="error">'+E(e.message)+'</div>'}
}
function getPos(){
 return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:10000}));
}
async function sendLocation(pos){
 if(!data?.jobs)return;
 const active=data.jobs.filter(j=>j.status!=='completed'&&j.status!=='cancelled');
 if(!active.length)return;
 const payload={p_token:token,p_lat:pos.coords.latitude,p_lng:pos.coords.longitude,p_accuracy:Math.round(pos.coords.accuracy||0)};
 await Promise.allSettled(active.map(j=>rpc('rentcam_driver_update_location',{...payload,p_assignment:j.id})));
 document.getElementById('liveText').textContent='Posisi terakhir '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function startLive(){
 if(!navigator.geolocation){alert('Browser tidak mendukung lokasi');return}
 if(watchId!==null)return;
 watchId=navigator.geolocation.watchPosition(async pos=>{
  const now=Date.now();if(now-lastSent<12000)return;lastSent=now;
  try{await sendLocation(pos)}catch(_){}
 },err=>{alert('Lokasi gagal: '+err.message);stopLive()},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
 document.getElementById('livebar').classList.add('on');render();
}
function stopLive(){
 if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
 watchId=null;document.getElementById('livebar').classList.remove('on');render();
}
async function updateStatus(id,status,button){
 button.disabled=true;
 try{
  let pos=null;try{pos=await getPos()}catch(_){}
  const d=await rpc('rentcam_driver_update_job',{
   p_token:token,p_assignment:id,p_status:status,
   p_lat:pos?.coords?.latitude??null,p_lng:pos?.coords?.longitude??null,
   p_accuracy:pos?Math.round(pos.coords.accuracy||0):null
  });
  if(!d?.ok)throw new Error(d?.message||'Gagal update status');
  await load(true);
 }catch(e){alert(e.message)}finally{button.disabled=false}
}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='loginForm')return;
 e.preventDefault();
 const fd=new FormData(e.target),btn=e.target.querySelector('button');btn.disabled=true;
 try{
  const d=await rpc('rentcam_driver_login',{p_username:String(fd.get('username')||''),p_password:String(fd.get('password')||'')});
  if(!d?.ok){renderLogin(d?.message||'Login gagal');return}
  token=d.token;localStorage.setItem(STORE,token);knownJobs.clear();await load();
 }catch(err){renderLogin(err.message)}finally{btn.disabled=false}
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='refresh'){await load();return}
 if(a==='logout'){try{await rpc('rentcam_driver_logout',{p_token:token})}catch(_){}stopLive();localStorage.removeItem(STORE);token='';data=null;renderLogin();return}
 if(a==='live'){watchId===null?startLive():stopLive();return}
 if(a==='notify'){
  if(!('Notification'in window)){alert('Browser ini belum mendukung notifikasi web.');return}
  const p=await Notification.requestPermission();alert(p==='granted'?'Notifikasi aktif.':'Notifikasi belum diizinkan.');return;
 }
 if(a==='next'){await updateStatus(b.dataset.id,b.dataset.status,b)}
});
load();
setInterval(()=>{if(token&&!document.hidden)load(true)},12000);
})();</script>
</body>
</html>
