<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BSM Display">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/signage.webmanifest?v=20260926-2210">
<title>Display</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:fixed;inset:0;background:#000;touch-action:manipulation}
#stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;z-index:0}
video.active{opacity:1;z-index:2}
video.standby{opacity:0;z-index:1}
#empty{position:absolute;inset:0;display:none;place-items:center;color:#777;font:14px system-ui;text-align:center;padding:24px;z-index:4;background:#000}
</style>
<script src="/signage-lib.js?v=20260926-2210"></script>
</head>
<body>
<div id="stage">
  <video id="videoA" class="active" muted autoplay playsinline webkit-playsinline preload="auto"></video>
  <video id="videoB" class="standby" muted autoplay playsinline webkit-playsinline preload="auto"></video>
  <div id="empty">Playlist kosong.</div>
</div>
<script>
const S=window.BSMSignage;
const A=document.getElementById('videoA');
const B=document.getElementById('videoB');
const empty=document.getElementById('empty');

const AUTOPLAY_RETRY_MS=400;
const SYNC_INTERVAL_MS=1000;
const PLAYBACK_WATCHDOG_MS=1000;
const STALL_RECOVERY_MS=3500;
const PRE_SWITCH_SECONDS=0.35;
const previewMode=location.hash.length>1;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(navigator.userAgent);

let config=previewMode?S.decodeConfig(location.hash.slice(1)):S.load();
let index=0;
let active=A;
let standby=B;
let standbyIndex=-1;
let swapping=false;
let autoplayTimer=null;
let syncBusy=false;
let watchdogTimer=null;
let stallTimer=null;
let wakeLock=null;
let lastProgressAt=Date.now();
let lastMediaTime=0;
let lastPreSwitchKey='';

function list(fromConfig=config){
  return (fromConfig?.videos||[]).filter(v=>v.enabled!==false&&(v.driveUrl||v.src));
}
function videoKey(v){
  if(!v)return '';
  return String(v.id||S.extractDriveFileId(v.driveUrl)||v.driveUrl||v.src||'');
}
function directDriveSource(v){
  return String(v?.src||S.driveVideoUrl(v?.driveUrl||'')||'').trim();
}
function proxyDriveSource(v){
  return String(S.driveProxyUrl(v)||'').trim();
}
function sourceCandidates(v){
  const direct=directDriveSource(v);
  const proxy=proxyDriveSource(v);
  const candidates=(isAndroid&&!isIOS)?[direct,proxy]:[proxy,direct];
  return [...new Set(candidates.filter(Boolean))];
}
function source(v,attempt=0){
  const candidates=sourceCandidates(v);
  return candidates[Math.min(Math.max(0,attempt),Math.max(0,candidates.length-1))]||'';
}
function apply(video,item){
  video.style.objectFit=item?.fit||'cover';
  video.muted=true;
  video.defaultMuted=true;
  video.playsInline=true;
  video.setAttribute('muted','');
  video.setAttribute('playsinline','');
}
function assign(video,item,attempt=0){
  const src=source(item,attempt);
  apply(video,item);
  video.dataset.key=videoKey(item);
  video.dataset.attempt=String(attempt);
  if(video.dataset.src!==src){
    video.dataset.src=src;
    video.src=src;
    video.load();
  }
}
function showEmpty(){
  empty.style.display='grid';
  A.pause();B.pause();
}
function hideEmpty(){empty.style.display='none'}
function clearAutoplayRetry(){
  if(autoplayTimer){clearTimeout(autoplayTimer);autoplayTimer=null}
}
function clearStallTimer(){
  if(stallTimer){clearTimeout(stallTimer);stallTimer=null}
}
function noteProgress(video){
  if(video!==active)return;
  const t=Number(video.currentTime||0);
  if(Math.abs(t-lastMediaTime)>0.05){
    lastMediaTime=t;
    lastProgressAt=Date.now();
    clearStallTimer();
  }
}
function scheduleAutoplayRetry(){
  clearAutoplayRetry();
  autoplayTimer=setTimeout(()=>{
    if(active&&active.paused&&!active.ended)tryPlay(active);
  },AUTOPLAY_RETRY_MS);
}
function tryPlay(video){
  if(!video)return Promise.resolve(false);
  video.muted=true;
  video.defaultMuted=true;
  let p;
  try{p=video.play()}catch(_){scheduleAutoplayRetry();return Promise.resolve(false)}
  if(!p||typeof p.then!=='function')return Promise.resolve(true);
  return p.then(()=>{
    clearAutoplayRetry();
    return true;
  }).catch(()=>{
    scheduleAutoplayRetry();
    return false;
  });
}
function cleanupVideo(video){
  video.pause();
  video.classList.remove('active');
  video.classList.add('standby');
  video.removeAttribute('src');
  video.dataset.src='';
  video.dataset.key='';
  video.dataset.attempt='0';
  video.load();
}
function restartSingle(){
  const items=list();
  if(items.length!==1)return false;
  const item=items[0];
  hideEmpty();
  apply(active,item);
  if(active.dataset.key!==videoKey(item))assign(active,item,0);
  try{active.currentTime=0}catch(_){}
  lastMediaTime=0;
  lastProgressAt=Date.now();
  lastPreSwitchKey='';
  tryPlay(active);
  return true;
}
function preloadNext(){
  const items=list();
  if(items.length<2){standbyIndex=-1;return}
  const nextIndex=(index+1)%items.length;
  standbyIndex=nextIndex;
  assign(standby,items[nextIndex],0);
}
function start(startIndex=0){
  const items=list();
  if(!items.length){showEmpty();return}
  hideEmpty();
  index=Math.max(0,Math.min(Number(startIndex)||0,items.length-1));
  assign(active,items[index],0);
  lastMediaTime=0;
  lastProgressAt=Date.now();
  lastPreSwitchKey='';
  tryPlay(active);
  preloadNext();
}
async function activateIndex(wanted,force=false){
  const items=list();
  if(!items.length)return showEmpty();

  if(items.length===1){
    if(force||active.ended||active.paused)return restartSingle();
    return;
  }

  wanted=Math.max(0,Math.min(Number(wanted)||0,items.length-1));
  if(swapping)return;
  if(!force&&wanted===index&&videoKey(items[wanted])===active.dataset.key&&!active.ended){
    tryPlay(active);
    return;
  }

  swapping=true;
  const target=items[wanted];
  if(standbyIndex!==wanted||standby.dataset.key!==videoKey(target)){
    standbyIndex=wanted;
    assign(standby,target,0);
  }

  const switchNow=async()=>{
    const started=await tryPlay(standby);
    if(!started){
      swapping=false;
      retryVideoSource(standby,target,()=>activateIndex(wanted,true));
      return;
    }

    const old=active;
    active=standby;
    standby=old;
    index=wanted;

    active.classList.remove('standby');
    active.classList.add('active');
    standby.classList.remove('active');
    standby.classList.add('standby');

    lastMediaTime=Number(active.currentTime||0);
    lastProgressAt=Date.now();
    lastPreSwitchKey='';
    clearStallTimer();

    cleanupVideo(standby);
    swapping=false;
    preloadNext();
  };

  if(standby.readyState>=2){
    await switchNow();
  }else{
    const ready=()=>{standby.removeEventListener('canplay',ready);switchNow()};
    standby.addEventListener('canplay',ready,{once:true});
    tryPlay(standby);
  }
}
function retryVideoSource(video,item,onExhausted){
  const candidates=sourceCandidates(item);
  const currentAttempt=Number(video.dataset.attempt||0);
  const nextAttempt=currentAttempt+1;
  if(nextAttempt<candidates.length){
    assign(video,item,nextAttempt);
    if(video===active)tryPlay(video);
    return true;
  }
  if(typeof onExhausted==='function')onExhausted();
  return false;
}
function activateStandby(force=false){
  const items=list();
  if(!items.length)return;
  if(items.length===1){restartSingle();return}
  activateIndex((index+1)%items.length,force);
}
function scheduleStallRecovery(video){
  if(video!==active||stallTimer)return;
  stallTimer=setTimeout(()=>{
    stallTimer=null;
    if(video!==active)return;
    const items=list();
    if(!items.length)return;
    const item=items[index];
    const recovered=retryVideoSource(active,item,()=>activateStandby(true));
    if(recovered){
      lastProgressAt=Date.now();
      tryPlay(active);
    }
  },STALL_RECOVERY_MS);
}
function maybePreSwitch(video){
  if(video!==active)return;
  const items=list();
  if(items.length<2)return;
  const duration=Number(video.duration||0);
  const current=Number(video.currentTime||0);
  if(!Number.isFinite(duration)||duration<=0)return;
  const remaining=duration-current;
  const key=videoKey(items[index]);
  if(remaining>0&&remaining<=PRE_SWITCH_SECONDS&&lastPreSwitchKey!==key){
    const nextIndex=(index+1)%items.length;
    if(standbyIndex===nextIndex&&standby.readyState>=2){
      lastPreSwitchKey=key;
      activateIndex(nextIndex,true);
    }
  }
}
function onEnded(e){
  if(e.target!==active)return;
  if(restartSingle())return;
  activateStandby(true);
}
function onPlaybackError(video){
  if(video!==active)return;
  const items=list();
  if(!items.length)return;
  const item=items[index];
  retryVideoSource(video,item,()=>activateStandby(true));
}
function watchdog(){
  if(document.hidden)return;
  const items=list();
  if(!items.length)return;
  if(active.ended){
    if(!restartSingle())activateStandby(true);
    return;
  }
  if(active.paused&&!swapping){
    tryPlay(active);
  }
  if(!active.paused&&Date.now()-lastProgressAt>STALL_RECOVERY_MS){
    scheduleStallRecovery(active);
  }
}

for(const video of [A,B]){
  video.addEventListener('ended',onEnded);
  video.addEventListener('playing',()=>{
    clearAutoplayRetry();
    clearStallTimer();
    if(video===active){
      lastProgressAt=Date.now();
      lastMediaTime=Number(video.currentTime||0);
    }
  });
  video.addEventListener('timeupdate',()=>{
    noteProgress(video);
    maybePreSwitch(video);
  });
  video.addEventListener('progress',()=>noteProgress(video));
  video.addEventListener('stalled',()=>scheduleStallRecovery(video));
  video.addEventListener('waiting',()=>scheduleStallRecovery(video));
  video.addEventListener('error',()=>onPlaybackError(video));
}

function findNewVideoIndex(previousConfig,nextConfig){
  const oldKeys=new Set(list(previousConfig).map(videoKey).filter(Boolean));
  let newest=-1;
  list(nextConfig).forEach((v,i)=>{if(!oldKeys.has(videoKey(v)))newest=i});
  return newest;
}
function currentKey(){
  return active?.dataset?.key||videoKey(list()[index]);
}
function applyRemoteConfig(fresh){
  const previous=config;
  const previousCurrentKey=currentKey();
  const newVideoIndex=findNewVideoIndex(previous,fresh);
  config=S.normalizeConfig(fresh||{});
  S.save(config);

  const items=list();
  if(!items.length){showEmpty();return}

  if(newVideoIndex>=0){
    activateIndex(newVideoIndex,true);
    return;
  }

  const stillCurrent=items.findIndex(v=>videoKey(v)===previousCurrentKey);
  if(stillCurrent>=0){
    index=stillCurrent;
    apply(active,items[index]);
    preloadNext();
    tryPlay(active);
    return;
  }
  activateIndex(0,true);
}
async function fetchDatabaseConfig(){
  try{
    const r=await fetch('/api/cms?asset=signage-config&_='+Date.now(),{
      cache:'no-store',
      credentials:'same-origin'
    });
    const data=await r.json();
    if(!r.ok||!data.ok||!data.config)throw new Error(data.message||'Database tidak tersedia');
    return S.normalizeConfig(data.config);
  }catch(_){return null}
}
async function syncNow(){
  if(previewMode||syncBusy)return;
  syncBusy=true;
  try{
    const fresh=await fetchDatabaseConfig();
    if(!fresh)return;
    if(Number(fresh.updatedAt||0)>Number(config.updatedAt||0)){
      applyRemoteConfig(fresh);
    }
  }finally{syncBusy=false}
}
async function requestWakeLock(){
  if(!('wakeLock' in navigator)||document.hidden)return;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{wakeLock=null});
  }catch(_){}
}
async function bootDisplay(){
  if(previewMode){
    start(0);
  }else{
    const remote=await fetchDatabaseConfig();
    if(remote)config=remote;
    start(0);
    setInterval(syncNow,SYNC_INTERVAL_MS);
  }
  watchdogTimer=setInterval(watchdog,PLAYBACK_WATCHDOG_MS);
  requestWakeLock();
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    requestWakeLock();
    tryPlay(active);
    syncNow();
  }
});
window.addEventListener('pageshow',()=>{requestWakeLock();tryPlay(active);syncNow()});
window.addEventListener('online',()=>{tryPlay(active);syncNow()});

window.addEventListener('storage',e=>{
  if(e.key===S.STORAGE_KEY&&!previewMode){
    const local=S.load();
    if(Number(local.updatedAt||0)>Number(config.updatedAt||0))applyRemoteConfig(local);
  }
});
try{
  const ch=new BroadcastChannel('bsm-signage');
  ch.onmessage=e=>{
    if(e.data?.type==='config'&&!previewMode){
      const incoming=S.normalizeConfig(e.data.config);
      if(Number(incoming.updatedAt||0)>Number(config.updatedAt||0))applyRemoteConfig(incoming);
    }
  };
}catch(_){}

bootDisplay();
</script>
</body>
</html>
