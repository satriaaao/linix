<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BSM Display">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/signage.webmanifest?v=20260926-2100">
<title>Display</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{position:fixed;inset:0;background:#000;touch-action:manipulation}
#stage{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;z-index:0}
video.active{opacity:1;z-index:2}
video.standby{opacity:0;z-index:1}
#empty{position:absolute;inset:0;display:none;place-items:center;color:#888;font:14px system-ui;text-align:center;padding:24px;z-index:4;background:#000}
#tap{position:absolute;inset:0;display:none;place-items:center;z-index:5;background:#0000;border:0;color:#fff;font:700 18px system-ui}
#tap span{background:#000a;border:1px solid #ffffff30;border-radius:999px;padding:14px 20px}
</style>
<script src="/signage-lib.js?v=20260926-2100"></script>
</head>
<body>
<div id="stage">
  <video id="videoA" class="active" muted autoplay playsinline webkit-playsinline preload="auto"></video>
  <video id="videoB" class="standby" muted playsinline webkit-playsinline preload="auto"></video>
  <div id="empty">Playlist kosong.</div>
  <button id="tap" type="button"><span>Putar Video</span></button>
</div>
<script>
const S=window.BSMSignage;
const A=document.getElementById('videoA');
const B=document.getElementById('videoB');
const empty=document.getElementById('empty');
const tap=document.getElementById('tap');

let config=location.hash.length>1?S.decodeConfig(location.hash.slice(1)):S.load();
let index=0;
let active=A;
let standby=B;
let standbyIndex=-1;
let swapping=false;

function list(){
  return (config.videos||[]).filter(v=>v.enabled!==false&&(v.driveUrl||v.src));
}
function source(v){
  return S.driveProxyUrl(v)||v.src||'';
}
function apply(video,item){
  video.style.objectFit=item?.fit||'cover';
  video.muted=true;
  video.playsInline=true;
}
function assign(video,item){
  const src=source(item);
  apply(video,item);
  if(video.dataset.src!==src){
    video.dataset.src=src;
    video.src=src;
    video.load();
  }
}
function showEmpty(){
  empty.style.display='grid';
  A.pause();B.pause();
}
function hideEmpty(){empty.style.display='none'}
function showTap(){tap.style.display='grid'}
function hideTap(){tap.style.display='none'}
function tryPlay(video){
  const p=video.play();
  if(p&&p.catch)p.catch(()=>showTap());
}
function preloadNext(){
  const items=list();
  if(items.length<2)return;
  const nextIndex=(index+1)%items.length;
  standbyIndex=nextIndex;
  assign(standby,items[nextIndex]);
}
function start(){
  const items=list();
  if(!items.length){showEmpty();return}
  hideEmpty();hideTap();
  index=Math.min(index,items.length-1);
  assign(active,items[index]);
  tryPlay(active);
  preloadNext();
}
function activateStandby(){
  if(swapping)return;
  const items=list();
  if(!items.length)return showEmpty();
  swapping=true;
  const wanted=(index+1)%items.length;
  if(standbyIndex!==wanted)assign(standby,items[wanted]);

  const switchNow=()=>{
    const old=active;
    active=standby;
    standby=old;
    index=wanted;
    active.classList.remove('standby');
    active.classList.add('active');
    standby.classList.remove('active');
    standby.classList.add('standby');
    tryPlay(active);
    standby.pause();
    standby.removeAttribute('src');
    standby.dataset.src='';
    standby.load();
    swapping=false;
    preloadNext();
  };

  if(standby.readyState>=2){
    switchNow();
  }else{
    const ready=()=>{standby.removeEventListener('canplay',ready);switchNow()};
    standby.addEventListener('canplay',ready,{once:true});
    tryPlay(standby);
  }
}
function onEnded(e){
  if(e.target!==active)return;
  activateStandby();
}
A.addEventListener('ended',onEnded);
B.addEventListener('ended',onEnded);

function recover(video){
  if(video!==active)return;
  const items=list();
  if(items.length>1)activateStandby();
}
A.addEventListener('error',()=>recover(A));
B.addEventListener('error',()=>recover(B));

tap.addEventListener('click',async()=>{
  hideTap();
  try{await active.play()}catch(_){showTap()}
  try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(_){}
});

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&active.paused)tryPlay(active);
});
window.addEventListener('storage',e=>{
  if(e.key===S.STORAGE_KEY&&location.hash.length<=1){
    config=S.load();index=0;active=A;standby=B;standbyIndex=-1;start();
  }
});
try{
  const ch=new BroadcastChannel('bsm-signage');
  ch.onmessage=e=>{
    if(e.data?.type==='config'&&location.hash.length<=1){
      config=S.normalizeConfig(e.data.config);index=0;active=A;standby=B;standbyIndex=-1;start();
    }
  };
}catch(_){}

start();
</script>
</body>
</html>
