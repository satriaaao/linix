<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSM Digital Signage CMS</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eef2ff;background:#090b10}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172033 0,#090b10 42%);min-height:100vh}
header{padding:18px 22px;border-bottom:1px solid #273047;background:#0d111bcc;position:sticky;top:0;backdrop-filter:blur(16px);z-index:5;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800}.brand span{color:#7dd3fc}.status{font-size:12px;color:#94a3b8}
main{max-width:1280px;margin:auto;padding:22px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.card{background:#101520;border:1px solid #283349;border-radius:18px;padding:18px;box-shadow:0 18px 50px #0005}
h2,h3{margin:0 0 14px}label{display:block;font-size:12px;color:#9ca3af;margin:12px 0 6px}
input,select,button{font:inherit}input,select{width:100%;background:#0b0f17;border:1px solid #344056;color:#fff;border-radius:11px;padding:11px 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e2e8f0;color:#0f172a}.primary{background:#38bdf8}.danger{background:#3b1720;color:#fecdd3}.ghost{background:#1c2535;color:#dbeafe}
.video{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #263147}.video:first-child{border-top:0}.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#1f2937}.meta{min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{color:#7f8da4}.actions{display:flex;gap:5px}.actions button{padding:7px 9px}
.previewWrap{display:grid;place-items:center;background:#05070b;border-radius:15px;padding:16px;min-height:580px}.phone{width:min(100%,320px);aspect-ratio:9/16;border:8px solid #1f2937;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 30px 60px #0009}.phone iframe{width:100%;height:100%;border:0}
.notice{font-size:12px;line-height:1.5;color:#94a3b8;background:#0b1018;border:1px dashed #2b3a51;padding:11px;border-radius:10px;margin-top:12px}
.empty{text-align:center;color:#6b7280;padding:30px 10px}
@media(max-width:900px){main{grid-template-columns:1fr}.previewWrap{min-height:auto}.phone{max-width:280px}}
</style>
<script src="/signage-lib.js"></script>
</head>
<body>
<header><div class="brand">BSM <span>Digital Signage</span></div><div class="status" id="saved">Belum ada perubahan</div></header>
<main>
<section>
<div class="card">
<h2>Tambah Video / Folder Google Drive</h2>
<div class="row"><div><label>Nama video</label><input id="title" placeholder="Promo Kamera September"></div><div><label>Mode tampilan</label><select id="fit"><option value="cover">Fill / Cover</option><option value="contain">Fit / Contain</option></select></div></div>
<label>Link File atau Folder Google Drive</label><input id="drive" placeholder="https://drive.google.com/drive/folders/... atau https://drive.google.com/file/d/.../view">
<div class="buttons"><button class="primary" id="add">Baca Link & Tambah</button><button class="ghost" id="sample">Isi Contoh Folder</button></div><div id="folderStatus" class="notice" style="display:none"></div>
<div class="notice">Bisa paste <b>link folder Google Drive</b> langsung. Semua video di dalam folder akan dibaca otomatis. Pastikan folder disetel <b>Anyone with the link / Siapa saja yang memiliki link</b>.</div>
</div>
<div class="card" style="margin-top:20px">
<div class="row"><div><label>Nama monitor</label><input id="name" value="Standing Lobby"></div><div><label>Orientasi</label><select id="orientation"><option value="portrait">Standing 9:16</option><option value="landscape">Landscape 16:9</option></select></div></div>
<h3 style="margin-top:18px">Playlist</h3><div id="list"></div>
<div class="buttons"><button class="primary" id="save">Simpan Playlist</button><button class="ghost" id="copy">Copy Link Monitor</button><button class="ghost" id="open">Buka Fullscreen</button><button class="danger" id="clear">Kosongkan</button></div>
</div>
</section>
<section class="card"><h2>Preview Monitor</h2><div class="previewWrap"><div class="phone" id="frameBox"><iframe id="preview" title="Preview signage"></iframe></div></div></section>
</main>
<script>
const S=window.BSMSignage; let config=S.load();
const $=id=>document.getElementById(id);
function syncForm(){ $('name').value=config.name||'Standing Lobby'; $('orientation').value=config.orientation||'portrait'; }
function monitorUrl(){ const base=location.origin+'/display'; return base+'#'+S.encodeConfig({...config,name:$('name').value,orientation:$('orientation').value}); }
function render(){
  config=S.normalizeConfig({...config,name:$('name').value||config.name,orientation:$('orientation').value});
  const list=$('list'); list.innerHTML='';
  if(!config.videos.length) list.innerHTML='<div class="empty">Belum ada video.</div>';
  config.videos.forEach((v,i)=>{
    const el=document.createElement('div');el.className='video';
    el.innerHTML='<div class="num">'+(i+1)+'</div><div class="meta"><b></b><small></small></div><div class="actions"><button class="ghost" data-up>↑</button><button class="ghost" data-down>↓</button><button class="danger" data-del>×</button></div>';
    el.querySelector('b').textContent=v.title; el.querySelector('small').textContent=(S.extractDriveFileId(v.driveUrl)?'Google Drive':'URL video')+' • '+v.fit;
    el.querySelector('[data-up]').onclick=()=>move(i,-1); el.querySelector('[data-down]').onclick=()=>move(i,1); el.querySelector('[data-del]').onclick=()=>{config.videos.splice(i,1);render()};
    list.appendChild(el);
  });
  const u=monitorUrl(); $('preview').src=u; $('frameBox').style.aspectRatio=config.orientation==='landscape'?'16/9':'9/16';
}
function move(i,d){const j=i+d;if(j<0||j>=config.videos.length)return;[config.videos[i],config.videos[j]]=[config.videos[j],config.videos[i]];render()}
async function addDriveSource(){
  const title=$('title').value.trim(),driveUrl=$('drive').value.trim(),fit=$('fit').value,btn=$('add'),status=$('folderStatus');
  if(!driveUrl)return alert('Masukkan link Google Drive.');
  if(S.isDriveFolderUrl(driveUrl)){
    btn.disabled=true;btn.textContent='Membaca folder...';status.style.display='block';status.textContent='Sedang membaca video dari folder Google Drive...';
    try{
      const r=await fetch('/api/drive-folder?url='+encodeURIComponent(driveUrl),{cache:'no-store'});
      const data=await r.json();
      if(!r.ok||!data.ok)throw new Error(data.message||'Folder tidak bisa dibaca');
      const existing=new Set(config.videos.map(v=>S.extractDriveFileId(v.driveUrl)||v.id));
      let added=0;
      (data.videos||[]).forEach(v=>{
        const key=S.extractDriveFileId(v.driveUrl)||v.id;
        if(existing.has(key))return;
        existing.add(key);added++;
        config.videos.push({id:v.id||('vid-'+Date.now()+'-'+added),title:v.title||('Video '+(config.videos.length+1)),driveUrl:v.driveUrl,fit,enabled:true});
      });
      config.folderUrl=driveUrl;
      status.textContent=(data.totalVideos||0)+' video ditemukan • '+added+' video baru ditambahkan';
      $('title').value='';render();
    }catch(e){
      status.textContent='Gagal membaca folder: '+String(e.message||e);
      alert('Folder belum bisa dibaca. Pastikan aksesnya "Siapa saja yang memiliki link".');
    }finally{btn.disabled=false;btn.textContent='Baca Link & Tambah'}
    return;
  }
  if(!S.extractDriveFileId(driveUrl)&&!/^https?:\/\//i.test(driveUrl))return alert('Link video tidak valid.');
  config.videos.push({id:'vid-'+Date.now(),title:title||('Video '+(config.videos.length+1)),driveUrl,fit,enabled:true});
  $('title').value='';$('drive').value='';render();
}
$('add').onclick=addDriveSource;
$('sample').onclick=()=>{$('title').value='';$('drive').value='https://drive.google.com/drive/u/0/mobile/folders/1yPsaDytDE33lPsbgyK_EjRx9SxzNsPrR?usp=sharing'};
$('save').onclick=()=>{config=S.save({...config,name:$('name').value,orientation:$('orientation').value});$('saved').textContent='Tersimpan '+new Date().toLocaleTimeString('id-ID');render()};
$('copy').onclick=async()=>{const u=monitorUrl();try{await navigator.clipboard.writeText(u);alert('Link monitor berhasil disalin.')}catch(_){prompt('Copy link monitor:',u)}};
$('open').onclick=()=>window.open(monitorUrl(),'_blank');
$('clear').onclick=()=>{if(confirm('Kosongkan semua video?')){config.videos=[];config.folderUrl='';S.save(config);$('folderStatus').style.display='none';render()}};
$('name').oninput=render;$('orientation').onchange=render;syncForm();render();
</script>
</body></html>
